<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My new trail</title>
<!--
  Trail template. Copy this folder with:   python tools/new_trail.py <id> --title "..."
  The rules every trail page follows (details in docs/ADDING_A_TRAIL.md):
    1. Call the engine with RELATIVE urls ("api/run", never "/api/run").
    2. Send the header  X-Lab-Token: window.LAB_TOKEN  on every API call.
    3. Report progress with  window.TRAIL.progress(done, total).
    4. Use the shared theme tokens (--th-*) from /hub/theme.css, and read window.TRAIL.lang ('en'|'es'|'pt').
    5. Keep your own localStorage keys prefixed with the trail id.
  The hub injects /hub/theme.css, window.LAB_TOKEN, window.TRAIL and the top-bar script (theme picker,
  EN | ES | PT toggle, trail switcher) at the end of the head element.
-->
<style>
:root {
  /* aliases for the shared theme tokens (dark, light and dracula live in /hub/theme.css) */
  --bg: var(--th-main, #16161a);
  --bg-2: var(--th-surface, #1d1d22);
  --line: var(--th-line, #2a2a31);
  --ink: var(--th-ink, #ececef);
  --ink-2: var(--th-ink-2, #a1a1aa);
  --accent: var(--th-accent, #facc15);
  --on-accent: var(--th-on-accent, #111);
  --ok: var(--th-ok, #4ade80);
  --ok-bg: var(--th-ok-bg, #1f3322);
  --err: var(--th-err, #f87171);
  --err-bg: var(--th-err-bg, #3b2020);
  --mono: var(--th-mono, ui-monospace, 'SF Mono', Menlo, Consolas, monospace);
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 14.5px;
  line-height: 1.7;
}
main {
  max-width: 820px;
  margin: 0 auto;
  padding: 24px 16px 60px;
}
h1 {
  font-size: 30px;
  margin: 8px 0 4px;
}
.lead {
  color: var(--ink-2);
  margin: 0 0 8px;
}
.progress {
  font-size: 13px;
  color: var(--ink-2);
  margin-bottom: 28px;
}
.exercise {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 18px 20px;
  margin: 0 0 24px;
}
.exercise h2 {
  font-size: 20px;
  margin: 0 0 6px;
}
.exercise.done h2::after {
  content: " ✓";
  color: var(--ok);
}
textarea {
  width: 100%;
  min-height: 130px;
  font: 14px/1.5 var(--mono);
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 10px 12px;
  resize: vertical;
  tab-size: 4;
}
button {
  font: inherit;
  font-size: 13.5px;
  font-weight: 700;
  background: var(--accent);
  color: var(--on-accent);
  border: 0;
  border-radius: 7px;
  padding: 6px 16px;
  cursor: pointer;
  margin-top: 8px;
}
button:disabled {
  opacity: .5;
  cursor: default;
}
.out {
  margin-top: 12px;
  font: 13.5px/1.5 var(--mono);
  white-space: pre-wrap;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 10px 12px;
  overflow-x: auto;
}
.out:empty {
  display: none;
}
.out.ok {
  border-color: var(--ok);
}
.out.err {
  border-color: var(--err);
  background: var(--err-bg);
}
.out table {
  border-collapse: collapse;
  font-size: 13px;
}
.out th,
.out td {
  border: 1px solid var(--line);
  padding: 3px 10px;
  text-align: left;
}
.offline {
  background: var(--err-bg);
  border-radius: 6px;
  padding: 10px 14px;
  margin-bottom: 20px;
}
</style>
</head>
<body>
<main>
  <h1 id="title">My new trail</h1>
  <p class="lead">Replace this text and the exercises below. Each exercise has starter code and an optional check.</p>
  <div class="progress" id="progress"></div>
  <div id="exercises"></div>
</main>

<script>
(function () {
  'use strict';
  var TRAIL = window.TRAIL || {};
  var ENGINE = TRAIL.engine || 'python';
  var STORE = (TRAIL.id || 'template') + '-progress-v1';      // rule 5: prefix your keys with the trail id
  // rule 4: UI text in the language picked in the top bar (TRAIL.t falls back to English)
  var UI = {
    progress: { en: '{d} of {t} exercises done', es: '{d} de {t} ejercicios hechos', pt: '{d} de {t} exercícios feitos' },
    run: { en: 'Run', es: 'Ejecutar', pt: 'Executar' },
    running: { en: 'Running…', es: 'Ejecutando…', pt: 'Executando…' },
    noEngine: { en: 'The engine did not answer: ', es: 'El motor no respondió: ', pt: 'O motor não respondeu: ' },
    openHub: { en: 'Open this trail through the hub (python engine/hub.py) to run the exercises.',
               es: 'Abre esta ruta a través del hub (python engine/hub.py) para ejecutar los ejercicios.',
               pt: 'Abra esta trilha pelo hub (python engine/hub.py) para executar os exercícios.' }
  };
  function t(key, vars) {
    var s = TRAIL.t ? TRAIL.t(UI[key]) : UI[key].en;
    return s.replace(/\{(\w+)\}/g, function (_, k) { return vars[k]; });
  }

  // ---- Exercises: edit these. "check" is optional.
  //  python engine:   check is Python code run after the learner's code; use assert.
  //  postgres engine: check is a reference query; the result must match it.
  var PYTHON_EXERCISES = [
    { id: 'hello', title: '1. Hello', text: 'Print a greeting.',
      code: 'name = "trail"\nprint(f"Hello, {name}!")', check: '' },
    { id: 'total', title: '2. A function', text: 'Make total() return the sum of the list.',
      code: 'def total(values):\n    ...\n\nprint(total([1, 2, 3]))',
      check: 'assert total([1, 2, 3]) == 6, "total([1, 2, 3]) should be 6"' }
  ];
  var SQL_EXERCISES = [
    { id: 'all-notes', title: '1. Read a table', text: 'List every note.',
      code: 'SELECT * FROM __SCHEMA__.notes ORDER BY id;', check: '' },
    { id: 'long-notes', title: '2. Filter', text: 'Return the topics that took more than 30 minutes.',
      code: 'SELECT topic\nFROM __SCHEMA__.notes\nWHERE ...;',
      check: 'SELECT topic FROM __SCHEMA__.notes WHERE minutes > 30;' }
  ];
  var EXERCISES = ENGINE === 'postgres' ? SQL_EXERCISES : PYTHON_EXERCISES;

  // ---- progress (rule 3)
  var state = { done: {} };
  try { state = JSON.parse(localStorage.getItem(STORE)) || state; } catch (e) {}
  function updateProgress() {
    var done = EXERCISES.filter(function (x) { return state.done[x.id]; }).length;
    document.getElementById('progress').textContent = t('progress', { d: done, t: EXERCISES.length });
    if (TRAIL.progress) TRAIL.progress(done, EXERCISES.length);
  }
  function markDone(id) {
    state.done[id] = true;
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
    updateProgress();
  }

  // ---- engine calls (rules 1 and 2)
  function api(action, body) {
    return fetch('api/' + action, body ? {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Lab-Token': window.LAB_TOKEN },
      body: JSON.stringify(body)
    } : { headers: { 'X-Lab-Token': window.LAB_TOKEN } }).then(function (r) { return r.json(); });
  }
  function run(ex, code) {
    if (ENGINE === 'postgres') return api('run', { sql: code, expected: ex.check || undefined });
    return api('run', { code: code, check: ex.check || undefined });
  }

  // ---- rendering results
  function esc(s) { return String(s == null ? 'NULL' : s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function showPython(res, out) {
    out.innerHTML = (res.output || []).map(function (p) { return esc(p[1]); }).join('') +
      (res.status === 'failed' ? '\n✗ ' + esc(res.assertion || 'check failed') : '');
    return res.status === 'ok';
  }
  function showSql(res, out) {
    if (!res.ok) { out.textContent = (res.error && res.error.message) || 'error'; return false; }
    var tables = (res.results || []).filter(function (r) { return r.columns; });
    var t = tables[tables.length - 1];
    out.innerHTML = t ? '<table><tr>' + t.columns.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr>' +
      t.rows.map(function (row) { return '<tr>' + row.map(function (v) { return '<td>' + esc(v) + '</td>'; }).join('') + '</tr>'; }).join('') +
      '</table>' : 'OK';
    if (res.check && !res.check.ok) { out.innerHTML += '\n✗ ' + esc(res.check.reason); return false; }
    return true;
  }

  var box = document.getElementById('exercises');
  if (!window.LAB_TOKEN && ENGINE !== 'none') {
    box.insertAdjacentHTML('beforebegin', '<p class="offline">' + t('openHub') + '</p>');
  }
  EXERCISES.forEach(function (ex) {
    var el = document.createElement('section');
    el.className = 'exercise' + (state.done[ex.id] ? ' done' : '');
    el.id = 'ex-' + ex.id;
    el.innerHTML = '<h2>' + esc(ex.title) + '</h2><p>' + esc(ex.text) + '</p>' +
      '<textarea spellcheck="false" aria-label="Code for ' + esc(ex.title) + '"></textarea>' +
      '<button type="button">' + t('run') + '</button><div class="out" aria-live="polite"></div>';
    var area = el.querySelector('textarea'), btn = el.querySelector('button'), out = el.querySelector('.out');
    area.value = ex.code;
    btn.disabled = !window.LAB_TOKEN;
    if (ENGINE === 'none') { btn.hidden = true; area.readOnly = true; }   // reading-only trail: nothing to run
    btn.addEventListener('click', function () {
      btn.disabled = true;
      out.className = 'out'; out.textContent = t('running');
      run(ex, area.value).then(function (res) {
        var ok = ENGINE === 'postgres' ? showSql(res, out) : showPython(res, out);
        out.className = 'out ' + (ok ? 'ok' : 'err');
        if (ok) { el.classList.add('done'); markDone(ex.id); }
      }).catch(function (e) {
        out.className = 'out err'; out.textContent = t('noEngine') + e.message;
      }).then(function () { btn.disabled = false; });
    });
    box.appendChild(el);
  });
  var title = (TRAIL.titles && TRAIL.titles[TRAIL.lang]) || TRAIL.title;
  if (title) { document.getElementById('title').textContent = title; document.title = title; }
  updateProgress();
})();
</script>
</body>
</html>
