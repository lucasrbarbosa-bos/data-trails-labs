<!doctype html>
<html lang="en" class="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My new trail</title>
<!--
  Trail template. Copy this folder with:   python tools/new_trail.py <id> --title "..."
  The rules every trail page follows (details in docs/ADDING_A_TRAIL.md):
    1. Call the engine with RELATIVE urls ("api/run", never "/api/run").
    2. Send the header  X-Lab-Token: window.LAB_TOKEN  on every API call.
    3. Report progress with  window.TRAIL.progress(done, total).
    4. Build on the shared kit: class "tl" on <html> gives the layout, prose and components of
       /hub/trail-base.css; colours are the --th-* tokens of /hub/theme.css. Read window.TRAIL.lang ('en'|'es'|'pt').
    5. Keep your own localStorage keys prefixed with the trail id.
  The hub injects /hub/theme.css, /hub/trail-base.css, window.LAB_TOKEN, window.TRAIL and the top-bar
  script (theme picker, EN | ES | PT toggle, trail switcher) at the end of the head element.
-->
<style>
/* Layout (sidebar | reading area), prose, nav, progress, exercise boxes (.ex), buttons (.btn) and
  check results (.result) come from /hub/trail-base.css. This block only adds what the template
  needs on top: a plain code box and the output area. It is not in a CSS layer, so it wins over the kit. */
.ex .code {
  display: block;
  width: 100%;
  min-height: 130px;
  font: 13px/21px var(--th-mono);
  color: var(--th-ink);
  background: var(--th-code);
  border: 1px solid var(--th-line);
  border-radius: 8px;
  padding: 12px 14px;
  resize: vertical;
  tab-size: 4;
}
.ex .code:focus {
  border-color: var(--th-accent);
  outline: none;
}
.ex .title .ck {
  color: var(--th-ok);
}
.out {
  margin: 10px 0 0;
  font: 13px/1.6 var(--th-mono);
  white-space: pre-wrap;
  background: var(--th-code);
  border: 1px solid var(--th-line);
  border-radius: 8px;
  padding: 10px 12px;
  overflow-x: auto;
}
.out:empty {
  display: none;
}
.out table {
  width: auto;
  font-size: 12.5px;
}
.out th,
.out td {
  padding: 4px 10px;
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="side-head">
      <div class="eyebrow"><span class="cmd">$ trail</span></div>
      <h1 id="title">My new trail</h1>
      <div class="sub">Replace this text and the exercises in index.html.</div>
    </div>
    <div class="progress">
      <div class="bar"><div id="bar"></div></div>
      <small id="progress"></small>
    </div>
    <nav id="nav" aria-label="Exercises"></nav>
  </aside>
  <main>
    <div class="mobile-top">
      <button type="button" id="menu" aria-label="Menu" aria-controls="side">☰</button>
      <span id="mobile-title"></span>
    </div>
    <div class="content">
      <p class="summary">Each exercise has starter code and an optional check.</p>
      <div id="exercises"></div>
    </div>
  </main>
</div>

<script>
(function () {
  'use strict';
  var TRAIL = window.TRAIL || {};
  var ENGINE = TRAIL.engine || 'python';
  var STORE = (TRAIL.id || 'template') + '-progress-v1';      // rule 5: prefix your keys with the trail id
  // rule 4: UI text in the language picked in the top bar (TRAIL.t falls back to English)
  var UI = {
    progress: { en: '{d} of {t} exercises done', es: '{d} de {t} ejercicios hechos', pt: '{d} de {t} exercícios feitos' },
    run: { en: 'Run', es: 'Ejecutar', pt: 'Executar' },
    running: { en: 'Running…', es: 'Ejecutando…', pt: 'Executando…' },
    passed: { en: '✓ Done', es: '✓ Hecho', pt: '✓ Feito' },
    failed: { en: 'The code ended with an error.', es: 'El código terminó con un error.', pt: 'O código terminou com um erro.' },
    noEngine: { en: 'The engine did not answer: ', es: 'El motor no respondió: ', pt: 'O motor não respondeu: ' },
    openHub: { en: 'Open this trail through the hub (python engine/hub.py) to run the exercises.',
               es: 'Abre esta ruta a través del hub (python engine/hub.py) para ejecutar los ejercicios.',
               pt: 'Abra esta trilha pelo hub (python engine/hub.py) para executar os exercícios.' }
  };
  function t(key, vars) {
    var s = TRAIL.t ? TRAIL.t(UI[key]) : UI[key].en;
    return s.replace(/\{(\w+)\}/g, function (_, k) { return vars[k]; });
  }

  // ---- Exercises: edit these. "check" is optional.
  //  python engine:   check is Python code run after the learner's code; use assert.
  //  postgres engine: check is a reference query; the result must match it.
  var PYTHON_EXERCISES = [
    { id: 'hello', title: '1. Hello', text: 'Print a greeting.',
      code: 'name = "trail"\nprint(f"Hello, {name}!")', check: '' },
    { id: 'total', title: '2. A function', text: 'Make total() return the sum of the list.',
      code: 'def total(values):\n    ...\n\nprint(total([1, 2, 3]))',
      check: 'assert total([1, 2, 3]) == 6, "total([1, 2, 3]) should be 6"' }
  ];
  var SQL_EXERCISES = [
    { id: 'all-notes', title: '1. Read a table', text: 'List every note.',
      code: 'SELECT * FROM __SCHEMA__.notes ORDER BY id;', check: '' },
    { id: 'long-notes', title: '2. Filter', text: 'Return the topics that took more than 30 minutes.',
      code: 'SELECT topic\nFROM __SCHEMA__.notes\nWHERE ...;',
      check: 'SELECT topic FROM __SCHEMA__.notes WHERE minutes > 30;' }
  ];
  var EXERCISES = ENGINE === 'postgres' ? SQL_EXERCISES : PYTHON_EXERCISES;

  // ---- progress (rule 3)
  var state = { done: {} };
  try { state = JSON.parse(localStorage.getItem(STORE)) || state; } catch (e) {}
  function updateProgress() {
    var done = EXERCISES.filter(function (x) { return state.done[x.id]; }).length;
    document.getElementById('progress').textContent = t('progress', { d: done, t: EXERCISES.length });
    document.getElementById('bar').style.width = (100 * done / EXERCISES.length) + '%';
    EXERCISES.forEach(function (x) {
      document.querySelectorAll('[data-ck="' + x.id + '"]').forEach(function (ck) { ck.textContent = state.done[x.id] ? ' ✓' : ''; });
    });
    if (TRAIL.progress) TRAIL.progress(done, EXERCISES.length);
  }
  function markDone(id) {
    state.done[id] = true;
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
    updateProgress();
  }

  // ---- engine calls (rules 1 and 2)
  function api(action, body) {
    return fetch('api/' + action, body ? {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Lab-Token': window.LAB_TOKEN },
      body: JSON.stringify(body)
    } : { headers: { 'X-Lab-Token': window.LAB_TOKEN } }).then(function (r) { return r.json(); });
  }
  function run(ex, code) {
    if (ENGINE === 'postgres') return api('run', { sql: code, expected: ex.check || undefined });
    return api('run', { code: code, check: ex.check || undefined });
  }

  // ---- rendering results: each returns { ok, output (HTML), message (when not ok) }
  function esc(s) { return String(s == null ? 'NULL' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function showPython(res) {
    var output = (res.output || []).map(function (p) { return esc(p[1]); }).join('');
    if (res.status === 'ok') return { ok: true, output: output };
    return { ok: false, output: output, message: res.status === 'failed' ? (res.assertion || 'check failed') : t('failed') };
  }
  function showSql(res) {
    if (!res.ok) return { ok: false, output: '', message: (res.error && res.error.message) || 'error' };
    var tables = (res.results || []).filter(function (r) { return r.columns; });
    var last = tables[tables.length - 1];
    var output = last ? '<table><thead><tr>' + last.columns.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      last.rows.map(function (row) { return '<tr>' + row.map(function (v) { return '<td>' + esc(v) + '</td>'; }).join('') + '</tr>'; }).join('') +
      '</tbody></table>' : 'OK';
    if (res.check && !res.check.ok) return { ok: false, output: output, message: res.check.reason };
    return { ok: true, output: output };
  }

  // ---- page
  var side = document.getElementById('side');
  var box = document.getElementById('exercises');
  var nav = document.getElementById('nav');
  if (!window.LAB_TOKEN && ENGINE !== 'none') {
    box.insertAdjacentHTML('beforebegin', '<p class="msg">' + t('openHub') + '</p>');
  }
  EXERCISES.forEach(function (ex, i) {
    nav.insertAdjacentHTML('beforeend', '<a href="#ex-' + esc(ex.id) + '"><span class="n">' + (i + 1) + '</span>' +
      '<span class="t">' + esc(ex.title.replace(/^\d+\.\s*/, '')) + '</span><span class="ck" data-ck="' + esc(ex.id) + '"></span></a>');
    var el = document.createElement('section');
    el.className = 'ex';
    el.id = 'ex-' + ex.id;
    el.innerHTML = '<div class="title">' + esc(ex.title) + '<span class="ck" data-ck="' + esc(ex.id) + '"></span></div>' +
      '<p class="prompt">' + esc(ex.text) + '</p>' +
      '<textarea class="code" spellcheck="false" aria-label="Code for ' + esc(ex.title) + '"></textarea>' +
      '<div class="actions"><button type="button" class="btn prim">' + t('run') + '</button></div>' +
      '<div class="result" aria-live="polite"></div><pre class="out"></pre>';
    var area = el.querySelector('textarea'), btn = el.querySelector('button');
    var result = el.querySelector('.result'), out = el.querySelector('.out');
    area.value = ex.code;
    btn.disabled = !window.LAB_TOKEN;
    if (ENGINE === 'none') { btn.hidden = true; area.readOnly = true; }   // reading-only trail: nothing to run
    btn.addEventListener('click', function () {
      btn.disabled = true;
      result.className = 'result vis'; result.textContent = t('running'); out.innerHTML = '';
      run(ex, area.value).then(function (res) {
        var shown = ENGINE === 'postgres' ? showSql(res) : showPython(res);
        out.innerHTML = shown.output;
        result.className = 'result vis ' + (shown.ok ? 'ok' : 'fail');
        result.textContent = shown.ok ? t('passed') : '✗ ' + shown.message;
        if (shown.ok) markDone(ex.id);
      }).catch(function (e) {
        result.className = 'result vis fail'; result.textContent = t('noEngine') + e.message;
      }).then(function () { btn.disabled = false; });
    });
    box.appendChild(el);
  });

  // ---- narrow screens: the menu button opens the sidebar, a link closes it
  document.getElementById('menu').addEventListener('click', function () { side.classList.toggle('open'); });
  nav.addEventListener('click', function () { side.classList.remove('open'); });

  var title = (TRAIL.titles && TRAIL.titles[TRAIL.lang]) || TRAIL.title;
  if (title) { document.getElementById('title').textContent = title; document.title = title; }
  document.getElementById('mobile-title').textContent = document.getElementById('title').textContent;
  updateProgress();
})();
</script>
</body>
</html>
