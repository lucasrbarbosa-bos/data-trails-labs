<!DOCTYPE html>
<html lang="pt-BR" class="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python Moderno — Laboratório interativo</title>
<style>
/* Colours, fonts and the top bar come from /hub/theme.css (themes: dark, light, dracula). Layout, prose,
  nav, progress, the code editor, buttons, results and chapter cards come from the shared kit
  /hub/trail-base.css (class "tl" on <html>). Both are injected by the hub. This block keeps what is
  particular to this trail, and the few places where it looks different from the kit; it is not in a
  CSS layer, so it wins over the kit. */
body {
  height: 100vh;
  height: 100dvh;
}
* {
  scrollbar-color: var(--th-line-2) transparent;
  scrollbar-width: thin;
}

/* ---------- layout: top bar (48px, from the hub) + sidebar | reading area, each scrolling on its own */
.app {
  flex: 1 1 auto;
  grid-template-columns: 300px minmax(0, 1fr);
}
aside {
  min-height: 0;
  padding: 20px 14px 40px;
}
.content {
  max-width: 880px;
  padding: 32px 36px 120px;
}

/* ---------- sidebar */
.eyebrow {
  font-size: 11px;
  font-weight: 600;
  line-height: inherit;
}
aside h1 {
  margin: 6px 0 2px;
  font-weight: 800;
}
aside .sub {
  margin-bottom: 16px;
}
.progress {
  margin: 0 0 14px;
}
.progress-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 11px;
  color: var(--th-ink-3);
  margin-bottom: 6px;
}
.progress-bar {
  height: 3px;
  background: var(--th-line);
  border-radius: 2px;
  overflow: hidden;
}
.progress-bar > div {
  height: 100%;
  background: var(--th-ok);
  width: 0;
  transition: width .4s;
}
.progress small {
  color: var(--th-ink-2);
}
.engine {
  margin: 0 0 18px;
  line-height: 1.5;
  border: 1px solid var(--th-line);
  border-radius: 8px;
  padding: 8px 10px;
  background: var(--th-main);
}
.engine i {
  flex: 0 0 7px;
}
.sec-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 8px;
}
.sec-nav::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--th-line);
}
nav a {
  display: block;
  color: var(--th-ink);
  border-left: 0;
  align-items: normal;
  gap: normal;
}
nav a:hover {
  background: var(--th-surface-2);
}
nav a.chapter {
  font-weight: 600;
  margin-top: 6px;
  display: flex;
  justify-content: space-between;
  gap: 8px;
}
nav a.chapter.active {
  background: var(--th-accent);
  color: var(--th-on-accent);
}
nav a.chapter.active .cnt,
nav a.chapter.active .cnt.full {
  color: var(--th-on-accent);
  opacity: .8;
}
nav a.sec {
  margin-left: 12px;
  padding-left: 12px;
  border-left: 1px solid var(--th-line);
  border-radius: 0 6px 6px 0;
  color: var(--th-ink-2);
  font-size: 11.5px;
}
nav a.sec:hover {
  color: var(--th-ink);
  border-left-color: var(--th-line-2);
}
nav a code {
  font-family: inherit;
}
nav a .cnt {
  font-weight: 400;
  color: var(--th-ink-3);
  font-size: 11px;
  white-space: nowrap;
}
nav a .cnt.full {
  color: var(--th-ok);
}

/* ---------- mobile top line (inside the reading area) */
.mobile-top {
  padding: 8px 16px;
  font-size: 13px;
}
.mobile-top b {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.mobile-top button {
  background: var(--th-surface);
  border: 1px solid var(--th-line);
  color: var(--th-ink);
  border-radius: 6px;
  padding: 2px 10px;
  font-size: 15px;
  cursor: pointer;
}
.overlay {
  display: none;
}

/* ---------- prose */
.loading {
  font-size: 13px;
}
.loading.error {
  color: var(--th-err);
}
h2.chapter {
  font-size: 25px;
  line-height: 1.3;
  margin: 4px 0 24px;
  font-weight: 800;
  letter-spacing: -0.02em;
}
h2.chapter::before {
  content: "# ";
  color: var(--th-ink-3);
  font-weight: 400;
}
h3.sec {
  font-size: 18px;
  line-height: 1.4;
  margin: 40px 0 12px;
  font-weight: 700;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--th-line);
  letter-spacing: normal;
  scroll-margin-top: 0;
}
h3.sec::before {
  font-weight: 400;
}
h4 {
  font-size: 15px;
  margin: 26px 0 8px;
  font-weight: 700;
}
h4::before {
  content: "### ";
  color: var(--th-ink-3);
  font-weight: 400;
}
p {
  margin: 0 0 14px;
  text-align: left;
}
ul.list {
  margin: 0 0 16px;
  padding-left: 4px;
  list-style: none;
}
ul.list li {
  margin-bottom: 6px;
  padding-left: 20px;
  position: relative;
}
ul.list li::marker {
  content: normal;
}
ul.list li::before {
  content: "-";
  position: absolute;
  left: 4px;
  color: var(--th-accent);
}
code {
  background: var(--th-surface);
  border: 1px solid var(--th-line);
  padding: 0 5px;
  color: inherit;
  overflow-wrap: normal;
}
.ex code,
.note code,
th code {
  background: var(--th-surface-2);
}
.table {
  margin: 0 0 20px;
  border: 0;
  border-radius: 0;
}
th,
td {
  border: 1px solid var(--th-line);
  padding: 6px 10px;
}
tbody tr:nth-child(even) td {
  background: none;
}
.ex th,
.debugger-panel th {
  background: var(--th-surface-2);
}

/* call-out notes: kind values (NOTE, WARNING, TIP, NEW) are data keys; only the label is translated */
.note {
  margin: 22px 0;
  background: var(--th-surface);
  border: 1px solid var(--th-line);
  border-left: 3px solid var(--note, var(--th-info));
  border-radius: 8px;
  padding: 10px 14px 4px;
}
.note .note-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--note, var(--th-info));
  margin-bottom: 2px;
}
.note .tx {
  margin-bottom: 8px;
}
.note.NOTE {
  --note: var(--th-info);
}
.note.WARNING {
  --note: var(--th-err);
}
.note.TIP {
  --note: var(--th-ok);
}
.note.NEW {
  --note: var(--th-warn);
}

/* ---------- examples and challenges */
.ex {
  position: relative;
  padding: 14px 18px 16px;
}
.ex.challenge {
  border-left: 3px solid var(--th-accent);
}
.ex .title {
  margin-bottom: 2px;
}
.ex .meta {
  font-size: 11.5px;
  color: var(--th-ink-3);
}
.ex .file::before {
  content: "$ ";
}
.pill {
  display: inline-block;
  border: 1px solid var(--th-line-2);
  border-radius: 999px;
  padding: 0 9px;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--th-accent);
}
.ex .done {
  font-size: 11.5px;
  color: var(--th-ok);
  font-weight: normal;
}
.callouts li {
  margin-bottom: 6px;
}

/* editor: textarea over a highlighted <pre> */
.editor {
  border-radius: 6px;
}
.editor:focus-within {
  border-color: var(--th-accent);
}
.area pre,
.area textarea {
  margin: 0;
  font-family: var(--th-mono);
  font-size: 13px;
  padding: 12px 14px;
  white-space: pre;
  border: 0;
  font-variant-ligatures: none;
}
.area textarea {
  resize: none;
  background: transparent;
  color: transparent;
}
.area textarea::selection {
  background: var(--th-select);
  color: transparent;
}
.static-code pre {
  margin: 0;
  font-family: var(--th-mono);
  font-size: 13px;
  padding: 12px 14px;
  overflow-x: auto;
  white-space: pre;
}
.current-line {
  background: var(--th-select);
  display: inline-block;
  width: 100%;
}
.gutter .current {
  color: var(--th-accent);
  font-weight: 700;
}

.btn {
  border: 1px solid var(--th-line);
}
.btn:hover {
  border-color: var(--th-line-2);
}
.btn.prim {
  border-color: var(--th-accent);
}
.btn.ok {
  border-color: var(--th-ok);
}
.field {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-top: 10px;
  font-size: 12.5px;
  flex-wrap: wrap;
}
.field label {
  color: var(--th-ink-2);
  min-width: 90px;
  padding-top: 6px;
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: .06em;
}
.field input,
.field textarea {
  flex: 1;
  min-width: 200px;
  font-family: var(--th-mono);
  font-size: 13px;
  padding: 6px 9px;
  border: 1px solid var(--th-line);
  border-radius: 6px;
  background: var(--th-code);
  color: var(--th-ink);
}
.field textarea {
  min-height: 52px;
  resize: vertical;
}
.field input::placeholder,
.field textarea::placeholder {
  color: var(--th-ink-3);
}

.output {
  margin-top: 10px;
  border-radius: 6px;
  border: 1px solid var(--th-line);
  background: var(--th-code);
  font-family: var(--th-mono);
  font-size: 13px;
  line-height: 1.6;
  display: none;
}
.output.vis {
  display: block;
}
.output .head,
.dbg-head,
.solution .head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 5px 12px;
  border-bottom: 1px solid var(--th-line);
  font-size: 11px;
  color: var(--th-ink-3);
}
.output .head > span:first-child,
.solution .head span,
.dbg-body h5 {
  text-transform: uppercase;
  letter-spacing: .08em;
  font-weight: 600;
}
.output .body {
  padding: 10px 12px;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 360px;
  overflow-y: auto;
}
.output .err {
  color: var(--th-err);
}
.output .tb {
  color: var(--th-err);
  background: var(--th-err-bg);
  border-radius: 4px;
  padding: 8px 10px;
  margin-top: 6px;
}
.output .tb a {
  color: var(--th-err);
  font-weight: 700;
  cursor: pointer;
  text-decoration: underline;
}
.output .error-hint {
  font-size: 12.5px;
  color: var(--th-ink);
  margin-top: 8px;
  padding-left: 10px;
  border-left: 2px solid var(--th-warn);
}
.muted {
  color: var(--th-ink-3);
}
.result {
  padding: 8px 12px;
  border-radius: 6px;
}
.result.ok {
  border-color: var(--th-ok);
}
.result.fail {
  border-color: var(--th-warn);
}
.inspector {
  margin-top: 10px;
  display: none;
}
.inspector.vis {
  display: block;
}
.inspector table {
  font-size: 12.5px;
  background: var(--th-code);
}
.inspector td:nth-child(1) {
  font-weight: 700;
  white-space: nowrap;
}
.inspector td:nth-child(2) {
  color: var(--th-bi);
  white-space: nowrap;
}
.inspector td:nth-child(3) {
  word-break: break-all;
}

/* step-by-step debugger (local engine only) */
.debugger-panel {
  margin-top: 10px;
  border: 1px solid var(--th-line);
  border-radius: 6px;
  display: none;
  background: var(--th-code);
}
.debugger-panel.vis {
  display: block;
}
.dbg-head {
  justify-content: flex-start;
  flex-wrap: wrap;
  padding: 8px 10px;
  font-size: 12px;
  color: var(--th-ink-2);
}
.dbg-head button {
  border: 1px solid var(--th-line);
  background: var(--th-surface-2);
  color: var(--th-ink);
  border-radius: 5px;
  padding: 1px 9px;
  cursor: pointer;
  font-size: 13px;
}
.dbg-head button:hover {
  border-color: var(--th-line-2);
}
.dbg-head input[type=range] {
  flex: 1;
  min-width: 120px;
  accent-color: var(--th-accent);
}
.dbg-info {
  color: var(--th-ink-2);
  min-width: 220px;
}
.dbg-event {
  padding: 6px 12px;
  font-size: 12.5px;
  color: var(--th-warn);
  display: none;
  border-bottom: 1px solid var(--th-line);
}
.dbg-event.vis {
  display: block;
}
.dbg-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
}
.dbg-body > div {
  padding: 8px 12px;
  min-width: 0;
}
.dbg-body > div + div {
  border-left: 1px solid var(--th-line);
}
.dbg-body h5 {
  margin: 0 0 6px;
  font-size: 11px;
  color: var(--th-ink-3);
}
.dbg-body table {
  font-size: 12px;
}
.dbg-body td {
  word-break: break-all;
}
.dbg-body td:nth-child(2) {
  color: var(--th-bi);
}
.dbg-body pre {
  margin: 0;
  font-family: var(--th-mono);
  font-size: 12.5px;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 220px;
  overflow-y: auto;
}
@media (max-width: 700px) {
  .dbg-body {
    grid-template-columns: 1fr;
  }
  .dbg-body > div + div {
    border-left: 0;
    border-top: 1px solid var(--th-line);
  }
}

.req {
  font-size: 12px;
  color: var(--th-warn);
  margin: 6px 0 18px;
}
.req::before {
  content: "! ";
  font-weight: 700;
}
.solution .head {
  border: 1px solid var(--th-line);
  border-bottom: 0;
  border-radius: 6px 6px 0 0;
  background: var(--th-code);
}
.solution .head + .editor {
  border-radius: 0 0 6px 6px;
}

.pagination {
  display: flex;
  justify-content: space-between;
  margin-top: 50px;
  gap: 12px;
}
.pagination a {
  color: var(--th-ink);
  text-decoration: none;
  border: 1px solid var(--th-line);
  border-radius: 8px;
  padding: 10px 16px;
  font-size: 13px;
  background: var(--th-surface);
}
.pagination a:hover {
  border-color: var(--th-line-2);
  background: var(--th-surface-2);
}
.pagination a:last-child {
  margin-left: auto;
  text-align: right;
}

/* ---------- trail home */
.home {
  padding-top: 12px;
}
.home .prompt {
  color: var(--th-ink-3);
  font-size: 12.5px;
  margin: 0;
}
.home .prompt em {
  color: var(--th-ok);
  font-style: normal;
}
.home h2 {
  font-size: clamp(28px, 5vw, 40px);
  line-height: 1.15;
  letter-spacing: -0.03em;
  font-weight: 800;
  margin: 8px 0 8px;
}
.home .sub {
  color: var(--th-ink-2);
  margin: 0 0 8px;
}
.label {
  margin: 30px 0 16px;
}
.label span {
  padding: 2px 12px;
}
.how {
  background: var(--th-surface);
  border: 1px solid var(--th-line);
  border-radius: 8px;
  padding: 12px 18px;
  font-size: 13.5px;
}
.how ul {
  margin: 0;
  padding: 0;
  list-style: none;
}
.how li {
  margin: 6px 0;
  padding-left: 20px;
  position: relative;
}
.how li::before {
  content: ">";
  position: absolute;
  left: 2px;
  color: var(--th-accent);
}
.card {
  gap: 6px;
  min-height: 112px;
}
.card .row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 11px;
  color: var(--th-ink-3);
}
.card .row .cmd {
  color: var(--th-python);
}
.card .row .cmd::before {
  content: "$ ";
  color: var(--th-ink-3);
}
.card .row .ok {
  color: var(--th-ok);
}
.card small {
  color: var(--th-ink-2);
}
.card .bar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 3px;
  background: var(--th-line);
  border-radius: 0;
  overflow: visible;
}
.card .bar div {
  height: 100%;
  background: var(--th-ok);
}

@media (max-width: 900px) {
  .app {
    grid-template-columns: minmax(0, 1fr);
  }
  aside {
    width: min(300px, 86vw);
    z-index: 25;
    transform: translateX(-100%);
    transition: transform .25s, visibility .25s;
    visibility: hidden;
    box-shadow: none;
  }
  body:not(.th-has-bar) aside {
    top: 0;
  }
  aside.open {
    transform: none;
    visibility: visible;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .35);
  }
  aside.open + main .overlay {
    display: block;
    position: fixed;
    inset: var(--th-bar-h) 0 0 0;
    z-index: 24;
    background: rgba(0, 0, 0, .35);
  }
  .content {
    padding: 20px 16px 100px;
  }
  .ex {
    padding: 12px 12px 14px;
  }
  h2.chapter {
    font-size: 22px;
  }
}
@media (prefers-reduced-motion: reduce) {
  aside,
  .progress-bar > div,
  .card {
    transition: none;
  }
}
</style>
</head>
<body>
<div class="app">
  <aside id="menu">
    <div class="eyebrow">~/trails/python</div>
    <h1 id="trailTitle">Python Moderno</h1>
    <div class="sub" id="trailSubtitle">Laboratório interativo · Python 3.15</div>
    <div class="progress">
      <div class="progress-row">
        <span id="progressLabel">progress</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar"><div id="progress-bar"></div></div>
      <small id="progressText"></small>
    </div>
    <div class="engine" id="engine"><i></i><span>…</span></div>
    <div class="sec-nav eyebrow" id="chaptersLabel">capítulos</div>
    <nav id="nav"></nav>
  </aside>
  <main id="main">
    <div class="mobile-top">
      <button id="btnMenu" aria-label="Menu" aria-controls="menu" aria-expanded="false">☰</button>
      <b id="mobileTitle">Python Moderno</b>
    </div>
    <div class="overlay" id="overlay"></div>
    <div class="content" id="content"><p class="loading">$ …</p></div>
  </main>
</div>

<script type="text/python" id="python_engine">
import sys
import traceback
import builtins
from browser import window


class _Stream:
    def __init__(self, kind):
        self.kind = kind

    def write(self, text):
        window.pyEmit(self.kind, str(text))
        return len(str(text))

    def flush(self):
        pass


def run(code, extra, inputs, argv):
    ns = {'__name__': '__main__'}
    queue = [str(x) for x in inputs]

    def _input(msg=''):
        sys.stdout.write(str(msg))
        if queue:
            value = queue.pop(0)
        else:
            value = window.prompt(str(msg) or str(window.pyInputLabel))
            value = '' if value is None else str(value)
        sys.stdout.write(value + '\n')
        return value

    saved = (sys.stdout, sys.stderr, builtins.input, sys.argv)
    sys.stdout, sys.stderr = _Stream('out'), _Stream('err')
    builtins.input = _input
    sys.argv = ['program.py'] + [str(a) for a in argv]
    status = 'ok'
    try:
        exec(compile(code, '<your code>', 'exec'), ns)
        if extra:
            exec(compile(extra, '<check>', 'exec'), ns)
    except SystemExit as e:
        if e.code not in (0, None):
            status = 'exit'
    except AssertionError as e:
        status = 'failed'
        window.pyEmit('assert', str(e) if str(e) else '')
    except BaseException:
        status = 'error'
        window.pyEmit('tb', traceback.format_exc())
    finally:
        sys.stdout, sys.stderr, builtins.input, sys.argv = saved
    variables = []
    for name, value in list(ns.items()):
        if name.startswith('__') or type(value).__name__ == 'module':
            continue
        try:
            text = repr(value)
        except Exception:
            text = '?'
        if len(text) > 160:
            text = text[:157] + '...'
        variables.append([name, type(value).__name__, text])
    window.pyVars(variables)
    return status


window.pyRun = run
window.pyReady()
</script>

  const LANG = window.TRAIL && UI[window.TRAIL.lang] ? window.TRAIL.lang : 'pt';

  // fixed texts in the HTML
  document.title = L.docTitle;
  document.getElementById('trailTitle').textContent = L.trailName;
  document.getElementById('trailSubtitle').textContent = L.trailSub;
  document.getElementById('progressLabel').textContent = L.progressLabel;
  document.getElementById('chaptersLabel').textContent = L.chapters;
  document.getElementById('btnMenu').setAttribute('aria-label', L.menu);
  document.getElementById('mobileTitle').textContent = L.trailName;

  // ---------- storage (per visitor) ----------
  const STORAGE_KEY = 'python-moderno-v1';

  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) {
      const saved = JSON.parse(s);
      // progress saved before the English rename used the keys feitos and codigos
      state.done = saved.done || saved.feitos || {};
      state.savedCode = saved.savedCode || saved.codigos || {};
    }
  } catch (e) {}
  function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }

  // the trail's content (content/<lang>.json), loaded at start-up
  let BOOK = null;

  // ---------- helpers ----------
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const escAttr = s => esc(s).replace(/"/g, '&quot;');
  function inline(t) {
    const codes = [];
    t = t.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    t = esc(t).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^\w*])\*([^*\s][^*]*?)\*(?![\w*])/g, '$1<i>$2</i>');
    return t.replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + esc(codes[+i]) + '</code>');
  }
  const CIRC = '❶❷❸❹❺❻❼❽❾❿';

  // ---------- syntax highlighting ----------
  const KW = new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case type lazy'.split(' '));
  const BI = new Set('print len range int float str bool list dict set tuple type input sum min max sorted reversed isinstance enumerate zip map filter open round abs any all repr help dir id iter next super object frozenset frozendict sentinel breakpoint format divmod pow hash chr ord'.split(' '));
  const TOKEN = /(#[^\n]*)|([rRbBfFtTuU]{0,2}("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'))|(\b\d[\d_]*(?:\.\d+)?(?:[eE][+-]?\d+)?\b)|([A-Za-z_À-ÿ][\wÀ-ÿ]*)/g;
  function highlight(code, lang) {
    if (lang !== 'python') return esc(code);
    let out = '', lastIndex = 0, previous = '';
    code.replace(TOKEN, (m, com, str, _q, num, name, pos) => {
      out += esc(code.slice(lastIndex, pos));
      let cls = null;
      if (com) cls = 'com'; else if (str) cls = 'str'; else if (num) cls = 'num';
      else if (name) {
        if (KW.has(name)) cls = 'kw';
        else if (previous === 'def' || previous === 'class') cls = 'fn';
        else if (BI.has(name)) cls = 'bi';
        previous = name;
      }
      out += cls ? '<span class="tk-' + cls + '">' + esc(m) + '</span>' : esc(m);
      lastIndex = pos + m.length;
      return m;
    });
    return out + esc(code.slice(lastIndex));
  }

  // ---------- Python engine ----------
  let ready = false, localMode = false, emitter = null, varsCollector = null;
  const engineEl = document.getElementById('engine');
  function setEngineStatus(statusClass, text) { engineEl.className = 'engine ' + statusClass; engineEl.querySelector('span').textContent = text; }
  setEngineStatus('', L.loadingPy);
  function enableRun() { ready = true; document.querySelectorAll('.btn-run').forEach(b => b.disabled = false); }

    setEngineStatus('ready', fmt(L.brythonOk, { v: (window.__BRYTHON__ && __BRYTHON__.implementation) ? __BRYTHON__.implementation.slice(0, 3).join('.') : '' }));

  function loadScript(src) {
    return new Promise((ok, error) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => error(new Error(src)); document.head.appendChild(s); });

      await loadScript('https://cdn.jsdelivr.net/npm/brython@3.12.4/brython_stdlib.js');

  async function startEngine() {
    if (window.LAB_TOKEN) {

  async function runCode(code, extra, inputs, argv, onEmit, onVars, debug) {
    if (localMode) {
      try {
        const r = await fetch('api/run', {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Lab-Token': window.LAB_TOKEN },
          body: JSON.stringify({ code, check: extra || '', inputs, argv, debug: !!debug })
        });
        const res = await r.json();
        if (!r.ok) { onEmit('tb', L.serverRefused + (res.error || r.status)); return { status: 'error', steps: [] }; }
        // the engine answers in English; show its known messages in the selected language
        const translate = text => (L.engineMessages || []).reduce((t, [re, to]) => t.replace(re, to), text);
        (res.output || []).forEach(([kind, text]) => onEmit(kind, kind === 'tb' ? translate(text) : text));
        if (res.status === 'failed') onEmit('assert', res.assertion || '');
        onVars(res.vars || []);
        return { status: res.status, steps: res.steps || [], output: res.output || [], truncated: res.truncated };
      } catch (e) {
        onEmit('tb', fmt(L.serverDown, { m: e.message }));
        return { status: 'error', steps: [] };
      }
    }
    emitter = onEmit; varsCollector = onVars;
    try { return { status: window.pyRun(code, extra || '', inputs, argv), steps: [] }; }
    catch (e) { onEmit('tb', L.internalErr + (e && e.message ? e.message : e)); return { status: 'error', steps: [] }; }
    finally { emitter = null; varsCollector = null; }
  }

  // ---------- progress ----------
  const activities = [];
  function updateProgress() {
    const total = activities.length, done = activities.filter(id => state.done[id]).length;
    const pct = total ? 100 * done / total : 0;
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('progressPct').textContent = Math.round(pct) + '%';
    document.getElementById('progressText').textContent = fmt(L.progress, { f: done, t: total });
    if (window.TRAIL && window.TRAIL.progress) window.TRAIL.progress(done, total);
    BOOK.chapters.forEach((chapter, i) => {
      const ids = chapter.activities, f = ids.filter(id => state.done[id]).length;
      const el = document.querySelector('#nav a[data-chapter="' + i + '"] .cnt');
      if (el) { el.textContent = f + '/' + ids.length; el.classList.toggle('full', f === ids.length && ids.length > 0); }
    });
  }
  function markDone(id) {
    if (!state.done[id]) { state.done[id] = true; save(); updateProgress(); }
    document.querySelectorAll('.done[data-done]').forEach(el => { if (el.dataset.done === id) el.textContent = L.done; });
  }
  const doneHtml = id => '<span class="done" data-done="' + escAttr(id) + '">' + (state.done[id] ? L.done : '') + '</span>';

  // ---------- editor ----------
  function createEditor(id, starter) {
    const saved = state.savedCode[id];
    const box = document.createElement('div');
    box.className = 'editor';
    box.innerHTML = '<div class="ed-wrap"><div class="gutter"></div><div class="area"><pre aria-hidden="true"></pre><textarea spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="' + escAttr(L.editorAria) + '"></textarea></div></div>';
    const ta = box.querySelector('textarea'), pre = box.querySelector('pre'), gut = box.querySelector('.gutter');
    ta.value = saved != null ? saved : starter;
    let errorLine = 0, currentLine = 0;
    function paint() {
      const lines = ta.value.split('\n');
      let html = highlight(ta.value, 'python');
      const marked = currentLine || errorLine, lineClass = currentLine ? 'current-line' : 'error-line';
      if (marked) {
        const parts = html.split('\n');
        if (parts[marked - 1] !== undefined) parts[marked - 1] = '<span class="' + lineClass + '">' + (parts[marked - 1] || ' ') + '</span>';
        html = parts.join('\n');
      }
      pre.innerHTML = html + '\n';
      gut.innerHTML = lines.map((_, i) => i + 1 === marked ? '<span class="' + (currentLine ? 'current' : 'error') + '">' + (i + 1) + '</span>' : (i + 1)).join('\n');
      const width = Math.max(...lines.map(l => l.length)) + 2;
      pre.style.minWidth = 'calc(' + width + 'ch + 28px)';
    }
    ta.addEventListener('input', () => { errorLine = 0; currentLine = 0; paint(); state.savedCode[id] = ta.value; save(); });
    ta.addEventListener('keydown', e => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const s = ta.selectionStart, f = ta.selectionEnd;
        if (e.shiftKey) {
          const lineStart = ta.value.lastIndexOf('\n', s - 1) + 1;
          if (ta.value.slice(lineStart, lineStart + 4) === '    ') { ta.value = ta.value.slice(0, lineStart) + ta.value.slice(lineStart + 4); ta.selectionStart = ta.selectionEnd = Math.max(lineStart, s - 4); }
        } else { ta.setRangeText('    ', s, f, 'end'); }
        ta.dispatchEvent(new Event('input'));
      } else if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
        const s = ta.selectionStart, lineStart = ta.value.lastIndexOf('\n', s - 1) + 1;
        const line = ta.value.slice(lineStart, s);
        let indent = (line.match(/^\s*/) || [''])[0];
        if (/:\s*(#.*)?$/.test(line)) indent += '    ';
        e.preventDefault();
        ta.setRangeText('\n' + indent, s, ta.selectionEnd, 'end');
        ta.dispatchEvent(new Event('input'));
      }
    });
    paint();
    return {
      el: box, ta,
      value: () => ta.value,
      setValue: v => { ta.value = v; errorLine = 0; paint(); state.savedCode[id] = v; save(); },
      markError: n => { errorLine = n; currentLine = 0; paint(); },
      markCurrent: n => { currentLine = n; paint(); },
      goToLine: n => {
        const lines = ta.value.split('\n'); let pos = 0;
        for (let i = 0; i < n - 1 && i < lines.length; i++) pos += lines[i].length + 1;
        ta.focus(); ta.setSelectionRange(pos, pos + (lines[n - 1] || '').length);
      }
    };
  }

  const ERROR_HINTS = L.errHints;

  // ---------- runnable cell ----------
  function cell(opts) {
    // opts: id, code, check, solution, challenge(bool)
    const frag = document.createElement('div');
    const ed = createEditor(opts.id, opts.code);
    frag.appendChild(ed.el);
    const usesInput = /\binput\s*\(/.test(opts.code);
    const usesArgv = /sys\.argv|parse_args\(argv\)|argparse/.test(opts.code) && !opts.challenge;
    let inputsField = null, argvField = null;
    if (usesInput) {
      const c = document.createElement('div'); c.className = 'field';
      c.innerHTML = '<label>' + esc(L.inputs) + '</label><textarea aria-label="' + escAttr(L.inputs) + '" placeholder="' + escAttr(L.inputsPh) + '"></textarea>';
      inputsField = c.querySelector('textarea'); inputsField.value = opts.inputs || '';
      frag.appendChild(c);
    }
    if (usesArgv) {
      const c = document.createElement('div'); c.className = 'field';
      c.innerHTML = '<label>' + esc(L.args) + '</label><input type="text" aria-label="' + escAttr(L.args) + '" placeholder="' + escAttr(L.argsPh) + '">';
      argvField = c.querySelector('input'); argvField.value = opts.argv || '';
      frag.appendChild(c);
    }
    const actions = document.createElement('div'); actions.className = 'actions';
    actions.innerHTML =
      '<button class="btn prim btn-run"' + (ready ? '' : ' disabled') + '>' + esc(L.run) + '</button>' +
      (opts.challenge ? '<button class="btn ok btn-run btn-check"' + (ready ? '' : ' disabled') + '>' + esc(L.verify) + '</button>' : '') +
      (localMode ? '<button class="btn btn-run btn-dbg">' + esc(L.debug) + '</button>' : '') +
      '<button class="btn btn-inspect">' + esc(L.vars) + '</button>' +
      '<button class="btn btn-reset">' + esc(L.reset) + '</button>' +
      (opts.challenge ? '<button class="btn btn-sol">' + esc(L.showSol) + '</button>' : '') +
      '<span class="shortcut">' + L.shortcut + (opts.challenge ? L.shortcutVerify : '') + '</span>';
    frag.appendChild(actions);
    const output = document.createElement('div'); output.className = 'output';
    output.innerHTML = '<div class="head"><span>' + esc(L.output) + '</span><span class="time"></span></div><div class="body"></div>';
    frag.appendChild(output);
    const result = document.createElement('div'); result.className = 'result'; result.setAttribute('role', 'status'); frag.appendChild(result);
    const inspect = document.createElement('div'); inspect.className = 'inspector table'; frag.appendChild(inspect);
    const dbg = document.createElement('div'); dbg.className = 'debugger-panel';
    const bt = (a, label, txt) => '<button data-a="' + a + '" title="' + escAttr(label) + '" aria-label="' + escAttr(label) + '">' + txt + '</button>';
    dbg.innerHTML = '<div class="dbg-head">' + bt('first', L.first, '⏮') + bt('prev', L.prev, '◀') + bt('next', L.next, '▶') + bt('last', L.last, '⏭') +
      '<input type="range" min="0" value="0" aria-label="' + escAttr(L.stepSlider) + '"><span class="dbg-info"></span>' + bt('close', L.closeDbg, '✕') + '</div>' +
      '<div class="dbg-event"></div><div class="dbg-body"><div><h5>' + esc(L.varsStep) + '</h5><div class="dbg-vars"></div></div><div><h5>' + esc(L.outSoFar) + '</h5><pre class="dbg-output"></pre></div></div>';
    frag.appendChild(dbg);
    let solDiv = null;
    if (opts.challenge) {
      solDiv = document.createElement('div'); solDiv.className = 'solution';
      solDiv.innerHTML = '<div class="head"><span>' + esc(L.solution) + '</span></div><div class="static-code editor"><pre>' + highlight(opts.solution, 'python') + '</pre></div><div class="actions"><button class="btn btn-use">' + esc(L.copyToEditor) + '</button></div>';
      frag.appendChild(solDiv);
      solDiv.querySelector('.btn-use').onclick = () => ed.setValue(opts.solution);
    }
    const body = output.querySelector('.body');
    let lastVars = [];

    let steps = [], fullOutput = [], currentStep = 0;
    function varsTable(list) {
      if (!list || !list.length) return '<small class="muted">' + esc(L.none) + '</small>';
      return '<table>' + list.map(([n, t, r]) => '<tr><td><b>' + esc(n) + '</b></td><td>' + esc(t) + '</td><td>' + esc(r) + '</td></tr>').join('') + '</table>';
    }
    function showStep(i) {
      if (!steps.length) return;
      currentStep = Math.max(0, Math.min(steps.length - 1, i));
      const p = steps[currentStep];
      ed.markCurrent(p.line);
      dbg.querySelector('input').value = currentStep;
      const where = p.stack.length > 1 ? p.stack.slice(1).join(' → ') + '()' : L.moduleLevel;
      dbg.querySelector('.dbg-info').textContent = fmt(L.stepInfo, { i: currentStep + 1, n: steps.length, l: p.line, where });
      const ev = dbg.querySelector('.dbg-event');
      if (p.event === 'return' && p.stack.length > 1) { ev.textContent = fmt(L.returned, { fn: p.stack[p.stack.length - 1], v: p.returned }); ev.className = 'dbg-event vis'; }
      else if (p.event === 'exception') { ev.textContent = L.exception + p.exception; ev.className = 'dbg-event vis'; }
      else { ev.className = 'dbg-event'; ev.textContent = ''; }
      dbg.querySelector('.dbg-vars').innerHTML = varsTable(p.vars) + (p.globals ? '<h5 style="margin-top:10px">' + esc(L.globals) + '</h5>' + varsTable(p.globals) : '');
      let text = '', remaining = p.output;
      for (const [kind, t] of fullOutput) { if (kind === 'tb' || remaining <= 0) continue; text += t.slice(0, remaining); remaining -= t.length; }
      dbg.querySelector('.dbg-output').textContent = text || L.nothingYet;
      const sd = dbg.querySelector('.dbg-output'); sd.scrollTop = sd.scrollHeight;
    }
    dbg.querySelector('.dbg-head').addEventListener('click', e => {
      const b = e.target.closest('button'); const a = b && b.dataset.a; if (!a) return;
      if (a === 'close') { dbg.classList.remove('vis'); ed.markCurrent(0); return; }
      showStep({ first: 0, prev: currentStep - 1, next: currentStep + 1, last: steps.length - 1 }[a]);
    });
    dbg.querySelector('input').addEventListener('input', e => showStep(+e.target.value));

    async function run(withCheck, debug) {
      if (!ready) return;
      const buttons = actions.querySelectorAll('.btn-run');
      buttons.forEach(b => b.disabled = true);
      body.innerHTML = '<span class="muted">' + esc(L.running) + '</span>'; output.classList.add('vis'); result.className = 'result';
      ed.markError(0);
      if (!debug) dbg.classList.remove('vis');
      const inputs = inputsField ? inputsField.value.split('\n').filter((l, i, a) => i < a.length - 1 || l !== '') : [];
      const argv = argvField ? argvField.value.trim().split(/\s+/).filter(Boolean) : [];
      let buffer = '';
      const t0 = performance.now();
      const res = await runCode(ed.value(), withCheck ? opts.check : '', inputs, argv, (kind, text) => {
        if (kind === 'out') { buffer += esc(text); }
        else if (kind === 'err') { buffer += '<span class="err">' + esc(text) + '</span>'; }
        else if (kind === 'tb') {
          let tb = esc(text);
          let errorLine = 0;
          tb = tb.replace(/File &quot;&lt;your code&gt;&quot;, line (\d+)|File "&lt;your code&gt;", line (\d+)/g, (m, a, b) => {
            const n = +(a || b); errorLine = n;
            return m.replace(/line \d+/, '<a data-l="' + n + '">' + esc(L.line) + ' ' + n + '</a>');
          });
          const errorType = (text.trim().split('\n').pop().match(/^(\w+)/) || [])[1];
          buffer += '<div class="tb">' + tb + '</div>' + (ERROR_HINTS[errorType] ? '<div class="error-hint">💡 ' + esc(ERROR_HINTS[errorType]) + '</div>' : '');
          if (errorLine) ed.markError(errorLine);
        } else if (kind === 'assert') {
          result.className = 'result vis fail';
          result.textContent = fmt(L.notPassed, { m: text ? ' — ' + text : '' });
        }
      }, v => { lastVars = v; }, debug);
      const status = res.status;
      buttons.forEach(b => b.disabled = false);
      body.innerHTML = buffer || '<span class="muted">' + esc(L.noOutput) + '</span>';
      body.querySelectorAll('a[data-l]').forEach(a => a.onclick = () => ed.goToLine(+a.dataset.l));
      output.querySelector('.time').textContent = (status === 'error' ? L.endedErr : '') + Math.round(performance.now() - t0) + ' ms';
      if (inspect.classList.contains('vis')) showVars();
      if (debug) {
        steps = res.steps || []; fullOutput = res.output || [];
        if (steps.length) {
          dbg.classList.add('vis');
          dbg.querySelector('input').max = steps.length - 1;
          if (res.truncated) dbg.querySelector('.dbg-info').title = L.truncated;
          showStep(0);
        }
      }
      if (withCheck) {
        if (status === 'ok') {
          result.className = 'result vis ok';
          result.textContent = L.passed;
          markDone(opts.id);
        } else if (status === 'error' && !result.classList.contains('vis')) {
          result.className = 'result vis fail';
          result.textContent = L.errBeforeCheck;
        }
      } else if (!opts.challenge && (status !== 'error' || opts.expectedError)) {
        markDone(opts.id);
      }
    }
    function showVars() {
      if (!lastVars.length) { inspect.innerHTML = '<small class="muted">' + esc(L.runForVars) + '</small>'; return; }
      inspect.innerHTML = '<table><tr><th>' + esc(L.colName) + '</th><th>' + esc(L.colType) + '</th><th>' + esc(L.colValue) + '</th></tr>' +
        lastVars.map(([n, t, r]) => '<tr><td>' + esc(n) + '</td><td>' + esc(t) + '</td><td>' + esc(r) + '</td></tr>').join('') + '</table>';
    }
    actions.querySelector('.btn-run').onclick = () => run(false);
    if (localMode) actions.querySelector('.btn-dbg').onclick = () => run(false, true);
    if (opts.challenge) actions.querySelector('.btn-check').onclick = () => run(true);
    actions.querySelector('.btn-inspect').onclick = () => { inspect.classList.toggle('vis'); showVars(); };
    actions.querySelector('.btn-reset').onclick = () => { ed.setValue(opts.code); body.innerHTML = ''; output.classList.remove('vis'); result.className = 'result'; };
    if (solDiv) actions.querySelector('.btn-sol').onclick = () => {
      if (solDiv.classList.contains('vis') || confirm(L.confirmSol)) solDiv.classList.toggle('vis');
    };
    ed.ta.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(opts.challenge && e.shiftKey); } });
    ed.ta.addEventListener('keydown', e => { if (e.key === 'F10' && dbg.classList.contains('vis')) { e.preventDefault(); showStep(currentStep + (e.shiftKey ? -1 : 1)); } });
    return frag;
  }

  // ---------- rendering ----------
  const content = document.getElementById('content');
  content.innerHTML = '<p class="loading">' + esc(L.loadingContent) + '</p>';
  function staticBlock(code, lang) {
    const d = document.createElement('div'); d.className = 'static-code editor';
    d.innerHTML = '<pre>' + highlight(code, lang) + '</pre>';
    return d;
  }
  const NOTE_ICONS = { NOTE: 'i', WARNING: '!', TIP: '✓', NEW: '★' };
  function renderChapter(ci) {
    const chapter = BOOK.chapters[ci];
    content.innerHTML = '';
    const h = document.createElement('h2'); h.className = 'chapter'; h.textContent = chapter.title; content.appendChild(h);
    let list = null;
    chapter.blocks.forEach(b => {
      if (b.t !== 'bullet') list = null;
      let el = null;
      switch (b.t) {
        case 'h2': el = document.createElement('h3'); el.className = 'sec'; el.id = b.anchor; el.innerHTML = inline(b.text); break;
        case 'h3': el = document.createElement('h4'); el.innerHTML = inline(b.text); break;
        case 'p': el = document.createElement('p'); el.innerHTML = inline(b.text); break;
        case 'bullet':
          if (!list) { list = document.createElement('ul'); list.className = 'list'; content.appendChild(list); }
          const li = document.createElement('li'); li.innerHTML = inline(b.text); list.appendChild(li); return;
        case 'note':
          el = document.createElement('div'); el.className = 'note ' + b.kind;
          el.innerHTML = '<div class="note-title">' + esc((NOTE_ICONS[b.kind] || 'i') + ' ' + (L.notes[b.kind] || b.kind)) + '</div><div class="tx">' + inline(b.text) + '</div>';
          break;
        case 'table':
          el = document.createElement('div'); el.className = 'table';
          el.innerHTML = '<table>' + b.rows.map((r, i) => '<tr>' + r.map(c => (i ? '<td>' : '<th>') + inline(c) + (i ? '</td>' : '</th>')).join('') + '</tr>').join('') + '</table>';
          break;
        case 'code':
          if (b.run || (localMode && b.lang === 'python')) { el = document.createElement('div'); el.style.margin = '18px 0'; el.appendChild(cell({ id: b.id || ('local-' + ci + '-' + b.code.length), code: b.code })); }
          else {
            el = document.createElement('div'); el.appendChild(staticBlock(b.code, b.lang));
            if (b.lang === 'python') { const r = document.createElement('div'); r.className = 'req'; r.textContent = L.reqCode; el.appendChild(r); }
            else el.style.margin = '0 0 18px';
          }
          break;
        case 'ex': {
          el = document.createElement('div'); el.className = 'ex';
          el.innerHTML = '<div class="title">' + inline(b.title) + '</div><div class="meta"><span class="file">' + esc(b.file) + '</span>' + (b.run ? doneHtml(b.id) : '') + '</div>';
          if (b.run || (localMode && b.lang === 'python')) el.appendChild(cell({ id: b.id || ('local-' + ci + '-' + b.code.length), code: b.code, inputs: b.inputs, argv: b.argv, expectedError: b.expectedError }));
          else {
            el.appendChild(staticBlock(b.code, b.lang));
            if (b.lang === 'python') { const r = document.createElement('div'); r.className = 'req'; r.style.margin = '8px 0 0'; r.textContent = L.reqEx; el.appendChild(r); }
          }
          if (b.callouts.length) {
            const ul = document.createElement('ul'); ul.className = 'callouts';
            ul.innerHTML = b.callouts.map((c, i) => '<li><span class="n">' + CIRC[i] + '</span><span>' + inline(c) + '</span></li>').join('');
            el.appendChild(ul);
          }
          break;
        }
        case 'challenge': {
          el = document.createElement('div'); el.className = 'ex challenge';
          el.innerHTML = '<div class="meta"><span class="pill">' + esc(L.challenge) + '</span>' + doneHtml(b.id) + '</div><div class="title">' + inline(b.title) + '</div><div class="prompt">' + inline(b.prompt) + '</div>';
          el.appendChild(cell({ id: b.id, code: b.starter, check: b.check, solution: b.solution, challenge: true }));
          break;
        }
      }
      if (el) content.appendChild(el);
    });
    const pager = document.createElement('div'); pager.className = 'pagination';
    pager.innerHTML = (ci > 0 ? '<a href="#chapter-' + ci + '">← ' + esc(BOOK.chapters[ci - 1].title) + '</a>' : '<a href="#home">← ' + esc(L.home) + '</a>') +
      (ci < BOOK.chapters.length - 1 ? '<a href="#chapter-' + (ci + 2) + '">' + esc(BOOK.chapters[ci + 1].title) + ' →</a>' : '<a href="#lab">' + esc(L.lab) + ' →</a>');
    content.appendChild(pager);
    document.getElementById('mobileTitle').textContent = chapter.title;
  }
  function renderHome() {
    const items = L.howItems.concat(localMode ? L.howLocal : L.howBrowser);
    content.innerHTML = '<div class="home"><div class="prompt">$ python3 --version <em>→ 3.15</em></div><h2>' + esc(L.trailName) + '</h2><p class="sub">' + esc(BOOK.subtitle) + '</p>' +
      '<div class="label"><span>' + esc(L.howTo) + '</span></div>' +
      '<div class="how"><ul>' + items.map(t => '<li>' + t + '</li>').join('') + '</ul></div>' +
      '<div class="label"><span>' + esc(L.chapters) + '</span></div><div class="cards">' +
      BOOK.chapters.map((c, i) => {
        const n = c.activities.length, f = c.activities.filter(id => state.done[id]).length;

        return '<a class="card" href="#chapter-' + (i + 1) + '"><span class="row"><span class="cmd">' + esc(num ? fmt(L.chapter, { n: num.padStart(2, '0') }) : L.annex) + '</span>' +
          '<span class="' + (n && f === n ? 'ok' : '') + '">' + f + '/' + n + '</span></span><b>' + esc(c.title) + '</b><small>' + esc(n === 1 ? L.activity : fmt(L.activities, { n })) + '</small>' +
          '<span class="bar"><div style="width:' + (n ? 100 * f / n : 0) + '%"></div></span></a>';
      }).join('') +
      '<a class="card" href="#lab"><span class="row"><span class="cmd">python3</span></span><b>' + esc(L.lab) + '</b><small>' + esc(L.labCard) + '</small></a></div></div>';
    document.getElementById('mobileTitle').textContent = L.trailName;
  }
  function renderLab() {
    content.innerHTML = '<h2 class="chapter">' + esc(L.lab) + '</h2><p>' + esc(L.labIntro) + '</p>';
    const d = document.createElement('div'); d.className = 'ex';
    d.appendChild(cell({ id: 'laboratorio', code: L.labCode }));   // storage id of the saved lab code: unchanged

  // ---------- navigation ----------
  const nav = document.getElementById('nav');
  const menu = document.getElementById('menu'), btnMenu = document.getElementById('btnMenu');
  function openMenu(open) { menu.classList.toggle('open', open); btnMenu.setAttribute('aria-expanded', String(open)); }
  let pendingAnchor = null;
  function route() {
    if (!BOOK) return;
    // links saved before the English rename used #inicio, #laboratorio and #cap-N
    const h = ({ inicio: 'home', laboratorio: 'lab' })[location.hash.slice(1)] ||
      location.hash.slice(1).replace(/^cap-(?=\d+$)/, 'chapter-') || 'home';
    const m = h.match(/^chapter-(\d+)$/);
    nav.querySelectorAll('a.chapter').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + h));
    if (m && BOOK.chapters[+m[1] - 1]) renderChapter(+m[1] - 1);
    else if (h === 'lab') renderLab();
    else renderHome();
    const anchorTarget = pendingAnchor && document.getElementById(pendingAnchor);
    if (anchorTarget) anchorTarget.scrollIntoView(); else document.getElementById('main').scrollTop = 0;
    pendingAnchor = null;
  }
  function init(book) {
    BOOK = book;
    nav.innerHTML = '<a href="#home" class="chapter">' + esc(L.home) + '</a>' + BOOK.chapters.map((c, i) =>
      '<a class="chapter" data-chapter="' + i + '" href="#chapter-' + (i + 1) + '"><span>' + esc(c.title) + '</span><span class="cnt"></span></a>' +
      c.sections.map(s => '<a class="sec" href="#chapter-' + (i + 1) + '" data-anchor="' + escAttr(s.anchor) + '">' + inline(s.title) + '</a>').join('')).join('') +
      '<a class="chapter" href="#lab">' + esc(L.lab) + '</a>';
    BOOK.chapters.forEach(c => activities.push(...c.activities));
    nav.addEventListener('click', e => {
      const a = e.target.closest('a'); if (!a) return;
      pendingAnchor = a.dataset.anchor || null;
      openMenu(false);
      if (a.getAttribute('href') === location.hash) { e.preventDefault(); route(); }
    });
    window.addEventListener('hashchange', route);
    route();
    updateProgress();
    startEngine();
  }
  btnMenu.onclick = () => openMenu(!menu.classList.contains('open'));
  document.getElementById('overlay').onclick = () => openMenu(false);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && menu.classList.contains('open')) openMenu(false); });

  async function loadContent(lang) {
    const r = await fetch('content/' + lang + '.json');
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }
  (async () => {
    let book = null;
    try { book = await loadContent(LANG); }
    catch (e) { try { book = await loadContent('pt'); } catch (e2) {} }
    if (!book || !Array.isArray(book.chapters)) {
      content.innerHTML = '<p class="loading error">' + esc(L.needHub) + '</p>';
      setEngineStatus('failed', '—');
      return;
    }
    init(book);
  })();
})();
</script>
</body>
</html>
