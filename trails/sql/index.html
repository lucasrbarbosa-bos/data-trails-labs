<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SQL Moderno — Laboratório</title>
<style>
/* Colours, font and the top bar come from the hub (/hub/theme.css, themes dark · light · dracula).
   The page keeps its old variable names as aliases of the shared --th-* tokens. */
:root {
  --bg: var(--th-main); --bg-2: var(--th-side); --bg-ex: var(--th-surface); --bg-ex-2: var(--th-surface-2); --bg-code: var(--th-code);
  --line: var(--th-line); --line-2: var(--th-line-2);
  --ink: var(--th-ink); --ink-2: var(--th-ink-2); --ink-3: var(--th-ink-3);
  --accent: var(--th-accent); --accent-2: var(--th-accent-bg); --on-accent: var(--th-on-accent); --link: var(--th-link);
  --ok: var(--th-ok); --ok-bg: var(--th-ok-bg); --err: var(--th-err); --err-bg: var(--th-err-bg);
  --warn: var(--th-warn); --warn-bg: var(--th-warn-bg); --info: var(--th-info); --info-bg: var(--th-info-bg);
  --kw: var(--th-kw); --str: var(--th-str); --com: var(--th-com); --num: var(--th-num); --bi: var(--th-bi); --fn: var(--th-fn);
  --mono: var(--th-mono, ui-monospace, 'SF Mono', Menlo, Consolas, monospace);
  --bar-h: var(--th-bar-h, 0px);
}
* { box-sizing: border-box; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body { margin: 0; height: 100dvh; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--mono); font-size: 14.5px; line-height: 1.75; }
button, input, textarea, select { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--link); }

/* ---------- layout: top bar (hub) + sidebar + reading area, each scrolling on its own ---------- */
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: calc(100dvh - var(--bar-h)); overflow: hidden; }
aside { background: var(--bg-2); border-right: 1px solid var(--line); overflow-y: auto; padding: 22px 16px 40px; font-size: 13px; line-height: 1.5; }
main { background: var(--bg); overflow-y: auto; height: 100%; min-width: 0; }
.conteudo { max-width: 880px; margin: 0 auto; padding: 34px 32px 120px; }

/* ---------- sidebar ---------- */
.marca { font-size: 11.5px; color: var(--ink-3); margin-bottom: 6px; }
.marca::before { content: "$ "; color: var(--accent); }
aside h1 { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.25; margin: 0 0 4px; }
aside .sub { color: var(--ink-2); font-size: 12px; margin-bottom: 16px; }
.rotulo { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 18px 0 8px; }
.progresso { margin: 6px 0 14px; }
.barra { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 2px 0 6px; }
.barra > div { height: 100%; background: var(--ok); width: 0; transition: width .4s; }
.progresso small { color: var(--ink-2); font-size: 11.5px; }
nav a { display: block; color: var(--ink-2); text-decoration: none; padding: 5px 8px; border-radius: 6px; font-size: 12.5px; line-height: 1.4; }
nav a:hover { background: var(--bg-ex); color: var(--ink); }
nav a.cap { color: var(--ink); font-weight: 600; margin-top: 6px; display: flex; justify-content: space-between; gap: 8px; }
nav a.cap.ativo { background: var(--accent); color: var(--on-accent); }
nav a.sec { padding-left: 20px; font-size: 12px; }
nav a.sec::before { content: "› "; color: var(--ink-3); }
nav a .cnt { font-weight: 400; color: var(--ink-3); font-size: 11px; white-space: nowrap; }
nav a .cnt.cheio { color: var(--ok); }
nav a.cap.ativo .cnt { color: var(--on-accent); opacity: .75; }
.esquema { margin-top: 14px; font-size: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.esquema summary { cursor: pointer; font-weight: 700; padding: 7px 10px; border-radius: 8px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.esquema summary:hover { color: var(--ink); background: var(--bg-ex); }
.esquema[open] summary { border-bottom: 1px solid var(--line); border-radius: 8px 8px 0 0; }
#esquema { padding: 4px 10px 10px; max-height: 50vh; overflow-y: auto; }
#esquema small { color: var(--ink-3); }
.tab-esq { margin: 8px 0 0; }
.tab-esq b { display: block; font-size: 12px; color: var(--ink); }
.tab-esq b::before { content: "▸ "; color: var(--ink-3); }
.tab-esq div { display: flex; justify-content: space-between; gap: 8px; padding-left: 14px; font-size: 11.5px; color: var(--ink-2); }
.tab-esq em { color: var(--bi); font-style: normal; }
.motor { margin-top: 18px; font-size: 11.5px; color: var(--ink-2); display: flex; align-items: flex-start; gap: 8px; }
.motor i { flex: 0 0 auto; width: 7px; height: 7px; margin-top: 5px; border-radius: 50%; background: var(--warn); display: inline-block; }
.motor.pronto i { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); }
.motor.falhou i { background: var(--err); }

/* ---------- mobile top line inside the reading area ---------- */
.topo-mobile { display: none; position: sticky; top: 0; z-index: 5; background: var(--bg-2); border-bottom: 1px solid var(--line); padding: 8px 16px; align-items: center; gap: 10px; font-size: 13px; }
.topo-mobile b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topo-mobile button { background: var(--bg-ex); border: 1px solid var(--line); color: var(--ink); border-radius: 6px; padding: 3px 10px; font-size: 15px; cursor: pointer; }

/* ---------- reading area ---------- */
.kicker { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 6px; }
.kicker::before { content: "# "; color: var(--accent); }
h2.cap { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.25; margin: 0 0 26px; }
h3.sec { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.35; margin: 44px 0 14px; padding-top: 18px; border-top: 1px solid var(--line); }
h3.sec::before { content: "## "; color: var(--ink-3); font-weight: 400; }
h4 { font-size: 15.5px; font-weight: 700; margin: 28px 0 10px; }
h4::before { content: "### "; color: var(--ink-3); font-weight: 400; }
p { margin: 0 0 16px; text-align: left; }
ul.lista { margin: 0 0 16px; padding-left: 22px; }
ul.lista li { margin-bottom: 6px; }
ul.lista li::marker { content: "- "; color: var(--ink-3); }
code { font-family: var(--mono); font-size: .9em; background: var(--bg-ex-2); border: 1px solid var(--line); padding: 0 5px; border-radius: 4px; }
.tabela { overflow-x: auto; margin: 0 0 20px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; line-height: 1.55; }
th, td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
th { background: var(--bg-ex); font-weight: 700; }
.nota { margin: 22px 0; border: 1px solid var(--line); border-left: 3px solid var(--k, var(--info)); border-radius: 8px; background: var(--bg-ex); padding: 10px 16px 12px; }
.nota .ic { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--k, var(--info)); margin-bottom: 2px; }
.nota .tx { text-align: left; }
.nota.NOTA { --k: var(--info); } .nota.ATENÇÃO { --k: var(--err); } .nota.DICA { --k: var(--ok); } .nota.NOVO { --k: var(--warn); }
.ex { background: var(--bg-ex); border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px 16px; margin: 26px 0; }
.ex .kicker { margin-bottom: 4px; }
.ex.desafio .kicker::before { content: "$ "; }
.ex .titulo { font-weight: 700; font-size: 15px; line-height: 1.45; margin-bottom: 4px; }
.ex .meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 4px 0 8px; flex-wrap: wrap; }
.arquivo { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
.ex .enunciado { margin: 8px 0 12px; }
.callouts { list-style: none; padding: 0; margin: 12px 0 0; font-size: 13.5px; }
.callouts li { display: grid; grid-template-columns: 24px 1fr; gap: 6px; margin-bottom: 6px; text-align: left; }
.callouts .n { color: var(--accent); }

/* ---------- editors ---------- */
.editor { position: relative; border: 1px solid var(--line); border-radius: 8px; background: var(--bg-code); overflow: hidden; }
.editor:focus-within { border-color: var(--accent); }
.ed-wrap { display: grid; grid-template-columns: auto 1fr; overflow-x: auto; }
.gutter { font-family: var(--mono); font-size: 13px; line-height: 21px; color: var(--ink-3); text-align: right; padding: 12px 8px 12px 10px; user-select: none; border-right: 1px solid var(--line); background: var(--bg-code); white-space: pre; }
.gutter .erro { color: var(--err); font-weight: 700; }
.area { position: relative; min-width: 0; }
.area pre, .area textarea { margin: 0; font-family: var(--mono); font-size: 13px; line-height: 21px; padding: 12px 14px; white-space: pre; tab-size: 4; border: 0; letter-spacing: 0; font-variant-ligatures: none; }
.area pre { pointer-events: none; color: var(--ink); min-height: 100%; }
.area textarea { position: absolute; inset: 0; width: 100%; height: 100%; resize: none; background: transparent; color: transparent; caret-color: var(--ink); outline: none; overflow: hidden; }
.area textarea::selection { background: var(--th-select, rgba(120, 150, 220, .35)); color: transparent; }
.estatico pre { margin: 0; font-family: var(--mono); font-size: 13px; line-height: 21px; padding: 12px 14px; overflow-x: auto; white-space: pre; color: var(--ink); }
.tk-kw { color: var(--kw); } .tk-str { color: var(--str); } .tk-com { color: var(--com); font-style: italic; }
.tk-num { color: var(--num); } .tk-bi { color: var(--bi); } .tk-fn { color: var(--fn); }
.linha-erro { background: var(--err-bg); display: inline-block; width: 100%; }
.abas { display: flex; gap: 4px; align-items: flex-end; margin-bottom: -1px; flex-wrap: wrap; position: relative; z-index: 1; }
.aba { border: 1px solid var(--line); border-bottom: 0; background: var(--bg-ex-2); color: var(--ink-2); border-radius: 6px 6px 0 0; padding: 4px 12px; font-size: 12px; cursor: pointer; }
.aba:hover { color: var(--ink); }
.aba.ativa { background: var(--bg-code); color: var(--ink); font-weight: 700; }
.aba-dica { margin-left: auto; font-size: 11px; color: var(--ink-3); padding-bottom: 4px; }
.variante .area textarea { cursor: default; }

/* ---------- buttons and output ---------- */
.acoes { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0; align-items: center; }
.btn { border: 1px solid var(--line-2); background: var(--bg-ex-2); color: var(--ink); border-radius: 6px; padding: 5px 12px; font-size: 12.5px; font-weight: 500; cursor: pointer; line-height: 1.4; }
.btn:hover { border-color: var(--accent); }
.btn.prim { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn.prim:hover { filter: brightness(1.08); }
.btn.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 700; }
.btn:disabled { opacity: .5; cursor: progress; }
.atalho { font-size: 11px; color: var(--ink-3); margin-left: auto; }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--bg-ex-2); color: var(--ink); }
.resultado { margin-top: 10px; padding: 9px 14px; border-radius: 8px; font-size: 13px; display: none; border: 1px solid transparent; }
.resultado.vis { display: block; }
.resultado.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.resultado.falha { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.solucao { margin-top: 12px; display: none; }
.solucao.vis { display: block; }
.saida-sql { margin-top: 10px; display: none; }
.saida-sql.vis { display: block; }
.res-bloco { border: 1px solid var(--line); border-radius: 8px; background: var(--bg-code); margin-bottom: 8px; overflow: hidden; }
.res-cab { padding: 6px 12px; font-size: 11.5px; color: var(--ink-2); border-bottom: 1px solid var(--line); background: var(--bg-ex-2); }
.res-cab::before { content: "> "; color: var(--accent); }
.res-bloco .res-cab:only-child { border-bottom: 0; }
.saida-sql > .res-cab { border: 1px solid var(--line); border-radius: 8px; }
.res-rodape { font-size: 11px; color: var(--ink-3); margin: 2px 2px 0; }
.grade { margin: 0; max-height: 380px; overflow: auto; }
.grade table { font-family: var(--mono); font-size: 12.5px; border: 0; }
.grade th { position: sticky; top: 0; background: var(--bg-ex-2); font-size: 12px; }
.grade th, .grade td { border-width: 0 1px 1px 0; white-space: nowrap; padding: 4px 10px; }
.grade td.num { text-align: right; color: var(--num); }
.nulo { color: var(--ink-3); font-style: italic; }
.plano { margin: 0; padding: 10px 12px; font-family: var(--mono); font-size: 12px; line-height: 1.6; white-space: pre; overflow-x: auto; color: var(--ink); }
.saida-sql .tb { color: var(--err); background: var(--err-bg); border: 1px solid var(--err); border-radius: 8px; padding: 10px 12px; font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; margin-bottom: 8px; }
.saida-sql .tb a { color: var(--err); font-weight: 700; text-decoration: underline; cursor: pointer; }
.rotulo-bloco { margin: 12px 0 4px; }
.selo-pratica { font-size: 11.5px; color: var(--warn); margin: 0 0 8px; }
.selo-pratica::before { content: "! "; font-weight: 700; }
.rotulo-sol { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 6px; }

/* ---------- pagination, home view ---------- */
.paginacao { display: flex; justify-content: space-between; margin-top: 50px; gap: 12px; flex-wrap: wrap; }
.paginacao a { color: var(--link); text-decoration: none; border: 1px solid var(--line); background: var(--bg-ex); border-radius: 8px; padding: 9px 14px; font-size: 13px; }
.paginacao a:hover { border-color: var(--line-2); background: var(--bg-ex-2); }
.carregando { color: var(--ink-3); font-size: 13px; padding-top: 20px; }
.carregando::before { content: "$ "; color: var(--accent); }
.aviso { border: 1px dashed var(--line-2); border-radius: 8px; padding: 18px 20px; color: var(--ink-2); margin-top: 20px; }
.aviso strong { color: var(--ink); display: block; margin-bottom: 4px; }
.inicio { padding-top: 18px; }
.inicio h2 { font-size: clamp(28px, 5vw, 40px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; margin: 0 0 8px; }
.inicio .sub { color: var(--ink-2); margin-bottom: 8px; }
.inicio .prompt { color: var(--ink-3); font-size: 12px; margin-bottom: 26px; }
.inicio .prompt em { color: var(--ok); font-style: normal; }
.label { display: flex; align-items: center; gap: 14px; margin: 30px 0 16px; color: var(--ink-2); font-size: 11.5px; }
.label::before, .label::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.label span { border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; background: var(--bg); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 12px; text-align: left; }
.card { position: relative; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px 16px; text-decoration: none; color: var(--ink); background: var(--bg-ex); overflow: hidden; display: flex; flex-direction: column; gap: 4px; transition: border-color .15s, background .15s; }
.card:hover { border-color: var(--line-2); background: var(--bg-ex-2); }
.card .num-cap { font-size: 11px; color: var(--th-postgres, var(--accent)); }
.card .num-cap::before { content: "$ "; color: var(--ink-3); }
.card b { display: block; font-size: 14px; line-height: 1.4; }
.card small { color: var(--ink-3); font-size: 11.5px; margin-top: auto; }
.card .mini { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--line); }
.card .mini span { display: block; height: 100%; background: var(--ok); width: 0; }
.como { text-align: left; background: var(--bg-ex); border: 1px solid var(--line); border-radius: 8px; padding: 14px 20px 6px; font-size: 13.5px; }
.como ul { padding-left: 18px; margin: 0 0 8px; }
.como li { margin-bottom: 6px; }
.como li::marker { content: "- "; color: var(--ink-3); }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  aside { position: fixed; top: var(--bar-h); bottom: 0; left: 0; width: min(300px, 86vw); z-index: 20; transform: translateX(-100%); transition: transform .25s, visibility .25s; visibility: hidden; }
  aside.aberto { transform: none; visibility: visible; box-shadow: 0 0 40px rgba(0,0,0,.35); }
  .topo-mobile { display: flex; }
  .conteudo { padding: 22px 16px 100px; }
  .ex { padding: 14px 12px; }
  h2.cap { font-size: 22px; }
  .atalho { display: none; }
}
@media (prefers-reduced-motion: reduce) { aside, .barra > div { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <aside id="menu">
    <div class="marca" id="marca">psql · lab</div>
    <h1 id="tituloTrilha">SQL Moderno</h1>
    <div class="sub" id="subTrilha"></div>
    <div class="progresso"><span class="rotulo" id="rotProgresso"></span><div class="barra"><div id="barra"></div></div><small id="txtProgresso"></small></div>
    <span class="rotulo" id="rotCapitulos"></span>
    <nav id="nav"></nav>
    <details class="esquema" id="esquemaBox"><summary id="rotEsquema"></summary><div id="esquema"><small id="esqCarregando"></small></div></details>
    <div class="motor" id="motor"><i></i><span></span></div>
  </aside>
  <main id="main">
    <div class="topo-mobile"><button id="btnMenu" type="button">☰</button><b id="tituloMobile">SQL Moderno</b></div>
    <div class="conteudo" id="conteudo"></div>
  </main>
</div>
<script>
(function () {
  'use strict';
  const TRAIL = window.TRAIL || {};
  const LANG = ['pt', 'en', 'es'].indexOf(TRAIL.lang) >= 0 ? TRAIL.lang : 'pt';

  // ---------- interface strings (content comes from content/<lang>.json) ----------
  const UI = {
    pt: {
      pageTitle: 'SQL Moderno — Laboratório',
      titulo: 'SQL Moderno',
      marca: 'psql · laboratório',
      subTrilha: 'Laboratório · PostgreSQL com Snowflake e BigQuery',
      rotProgresso: 'progresso',
      rotCapitulos: 'capítulos',
      progresso: (f, t) => f + ' de ' + t + ' atividades concluídas',
      esquema: 'Esquema da base',
      conectando: 'Conectando…',
      soServidor: 'Disponível com o servidor local.',
      procurando: 'Procurando o servidor…',
      somenteLeitura: 'Somente leitura. Para executar, abra pelo Trails Lab: docker compose up -d (veja o README)',
      motorPronto: v => 'PostgreSQL ' + v + ' (Docker) · transações desfeitas a cada execução',
      motorFalhou: m => 'O servidor respondeu, mas o Postgres não: rode "docker compose up -d" e recarregue. (' + m + ')',
      semResposta: 'sem resposta',
      abrirMenu: 'Abrir menu', navCapitulos: 'Capítulos', editorSql: 'Editor SQL', editorLeitura: 'Exemplo somente leitura',
      planoExec: 'plano de execução', executado: 'executado',
      linhas: n => n + (n === 1 ? ' linha' : ' linhas'), mostrando: n => ' (mostrando ' + n + ')',
      soPostgres: 'só o PostgreSQL executa no laboratório',
      executar: '▶ Executar', verificar: '✓ Verificar', plano: 'Plano de execução', restaurar: '↺ Restaurar', verSolucao: 'Ver solução',
      copiar: 'Copiar para o editor', solucao: 'Solução',
      atalho: '<kbd>Ctrl</kbd>+<kbd>Enter</kbd> executa', atalhoDesafio: '<kbd>Ctrl</kbd>+<kbd>Enter</kbd> executa · <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Enter</kbd> verifica',
      executando: 'executando…', semServidor: 'Não consegui falar com o servidor local. Ele ainda está rodando?',
      comando: n => 'Comando ' + n, linha: n => 'linha ' + n, nada: 'nada a executar',
      rodape: ms => ms + ' ms · alterações desfeitas automaticamente (ROLLBACK)',
      sucesso: '✓ Resultado igual ao esperado. Desafio concluído!',
      aindaNao: m => 'Ainda não: ' + m + '.', comErro: 'a consulta terminou com erro',
      confirmaSol: 'Mostrar a solução?',
      ordemVerificada: '(a ordem das linhas é verificada)',
      seloPratica: 'prática sem gabarito · diga em voz alta grão, partição e ordem',
      exemplo: 'exemplo', desafio: 'desafio', pratica: 'prática', capitulo: (i, n) => 'capítulo ' + i + ' / ' + n,
      inicio: 'Início', console: 'Console livre', consoleSub: 'Um editor SQL em branco',
      consoleTexto: 'Um espaço para qualquer consulta na base da loja. Para salvar mudanças, use outra ferramenta conectada em <code>localhost:5433</code> (usuário e senha <code>lab</code>).',
      atividades: n => n + (n === 1 ? ' atividade' : ' atividades'),
      comoUsar: 'como usar', rotCards: 'capítulos',
      prompt: 'psql -d loja <em>-- pronto para consultar</em>',
      como: [
        'Todo exemplo em PostgreSQL é um editor: altere e clique em <b>▶ Executar</b> (<kbd>Ctrl</kbd>+<kbd>Enter</kbd>). Vários comandos podem ser executados de uma vez; cada resultado aparece separado.',

  const L = UI[LANG] || UI.pt;

  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    $('motor').className = 'motor falhou';
    $('esquema').innerHTML = '<small>' + esc(L.soServidor) + '</small>';
    return;
  }

  conteudo.innerHTML = '<div class="carregando">' + esc(L.carregando) + '</div>';
  const pegar = l => fetch('content/' + l + '.json', { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  pegar(LANG).catch(() => pegar('pt')).then(iniciarTrilha, e => {
    conteudo.innerHTML = '<div class="aviso"><strong>' + esc(L.falhaConteudo) + '</strong>' + esc(e.message) + '</div>';

  function iniciarTrilha(DADOS) {
  const CHAVE = 'sql-moderno-v1';
  let estado = { feitos: {}, codigos: {} };
  try { const s = localStorage.getItem(CHAVE); if (s) estado = Object.assign(estado, JSON.parse(s)); } catch (e) {}
  const salvar = () => { try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (e) {} };

  function inline(t) {
    const codes = [];
    t = t.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    t = esc(t).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^\w*])\*([^*\s][^*]*?)\*(?![\w*])/g, '$1<i>$2</i>');
    return t.replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + esc(codes[+i]) + '</code>');
  }
  const CIRC = '❶❷❸❹❺❻❼❽❾❿';
  const NOMES_DIALETO = { sql: 'PostgreSQL', snowflake: 'Snowflake', bigquery: 'BigQuery', text: 'Terminal', dbt: 'dbt (SQL + Jinja)', sqlmesh: 'SQLMesh', yaml: 'YAML' };

  // ---------- SQL highlighting ----------
  const KW = new Set(('select from where and or not in is null as on join left right full outer inner cross lateral using group by having order asc desc nulls first last limit offset fetch ' +
    'distinct all union intersect except with recursive case when then else end between like ilike exists any some insert into values update set delete returning ' +
    'create table index view materialized drop alter add column primary key foreign references unique check default generated always identity constraint ' +
    'over partition window rows range unbounded preceding following current row filter within qualify interval true false begin commit rollback explain analyze ' +
    'grouping sets rollup cube cast if replace temporary temp conflict do nothing merge matched struct array unnest').split(' '));
  const FN = new Set(('count sum avg min max round coalesce nullif greatest least upper lower length trim split_part concat string_agg array_agg listagg ' +
    'row_number rank dense_rank ntile lag lead first_value last_value nth_value percent_rank cume_dist date_trunc extract now current_date current_timestamp ' +
    'generate_series to_char to_date date_part age abs ceil floor count_if countif iff regexp_like regexp_contains dateadd datediff date_sub date_add ' +
    'generate_date_array json_agg jsonb_build_object grouping split safe_offset format').split(' '));
  const TOKEN = /(--[^\n]*|\/\*[\s\S]*?\*\/)|('(?:[^']|'')*')|("(?:[^"]|"")*")|(\b\d+(?:\.\d+)?\b)|(::\w+)|([A-Za-z_][\w$]*)/g;
  function realce(code, lang) {
    if (lang === 'text' || lang === 'yaml') return esc(code);
    let out = '', ultimo = 0;
    code.replace(TOKEN, (m, com, str, ident, num, cast, nome, pos) => {
      out += esc(code.slice(ultimo, pos));
      let cls = null;
      if (com) cls = 'com'; else if (str) cls = 'str'; else if (num) cls = 'num'; else if (cast) cls = 'bi';
      else if (nome) { const l = nome.toLowerCase(); if (KW.has(l)) cls = 'kw'; else if (FN.has(l)) cls = 'fn'; }
      out += cls ? '<span class="tk-' + cls + '">' + esc(m) + '</span>' : esc(m);
      ultimo = pos + m.length; return m;
    });
    return out + esc(code.slice(ultimo));
  }

  // ---------- server ----------
  let pronto = false;
  const motorEl = $('motor');
  const statusMotor = (c, t) => { motorEl.className = 'motor ' + c; motorEl.querySelector('span').textContent = t; };
  async function api(caminho, corpo) {
    const r = await fetch(caminho, corpo ? { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Lab-Token': window.LAB_TOKEN }, body: JSON.stringify(corpo) }
                                          : { headers: { 'X-Lab-Token': window.LAB_TOKEN } });

  }
  async function iniciar() {
    if (!window.LAB_TOKEN) {

    } catch (e) {

  // ---------- progress ----------
  const atividades = [];
  function atualizarProgresso() {
    const total = atividades.length, feitos = atividades.filter(id => estado.feitos[id]).length;
    $('barra').style.width = (total ? 100 * feitos / total : 0) + '%';
    $('txtProgresso').textContent = L.progresso(feitos, total);
    if (window.TRAIL && window.TRAIL.progress) window.TRAIL.progress(feitos, total);
    DADOS.capitulos.forEach((cap, i) => {
      const f = cap.atividades.filter(id => estado.feitos[id]).length;
      const el = document.querySelector('#nav a[data-cap="' + i + '"] .cnt');
      if (el) { el.textContent = f + '/' + cap.atividades.length; el.classList.toggle('cheio', f === cap.atividades.length && f > 0); }
    });
  }
  const marcar = id => { if (!estado.feitos[id]) { estado.feitos[id] = true; salvar(); atualizarProgresso(); } };

  // ---------- editor ----------
  function criarEditor(id, inicial, somenteLeitura, lang) {
    const box = document.createElement('div'); box.className = 'editor';
    box.innerHTML = '<div class="ed-wrap"><div class="gutter"></div><div class="area"><pre aria-hidden="true"></pre><textarea spellcheck="false" autocapitalize="off" autocomplete="off"></textarea></div></div>';
    const ta = box.querySelector('textarea'), pre = box.querySelector('pre'), gut = box.querySelector('.gutter');
    ta.setAttribute('aria-label', somenteLeitura ? L.editorLeitura : L.editorSql);
    const salvo = somenteLeitura ? null : estado.codigos[id];
    ta.value = salvo != null ? salvo : inicial;
    ta.readOnly = !!somenteLeitura;
    let erroLinha = 0;
    function pintar() {
      const linhas = ta.value.split('\n');
      let html = realce(ta.value, lang || 'sql');
      if (erroLinha) { const p = html.split('\n'); if (p[erroLinha - 1] !== undefined) p[erroLinha - 1] = '<span class="linha-erro">' + (p[erroLinha - 1] || ' ') + '</span>'; html = p.join('\n'); }
      pre.innerHTML = html + '\n';
      gut.innerHTML = linhas.map((_, i) => i + 1 === erroLinha ? '<span class="erro">' + (i + 1) + '</span>' : (i + 1)).join('\n');
      pre.style.minWidth = 'calc(' + (Math.max(...linhas.map(l => l.length)) + 2) + 'ch + 28px)';
    }
    ta.addEventListener('input', () => { erroLinha = 0; pintar(); if (!somenteLeitura) { estado.codigos[id] = ta.value; salvar(); } });
    ta.addEventListener('keydown', e => {
      if (e.key === 'Tab' && !somenteLeitura) { e.preventDefault(); ta.setRangeText('    ', ta.selectionStart, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input')); }
    });
    pintar();
    return {
      el: box, ta, valor: () => ta.value,
      definir: v => { ta.value = v; erroLinha = 0; pintar(); estado.codigos[id] = v; salvar(); },
      marcarErro: n => { erroLinha = n; pintar(); },
      irPara: n => { const l = ta.value.split('\n'); let pos = 0; for (let i = 0; i < n - 1 && i < l.length; i++) pos += l[i].length + 1; ta.focus(); ta.setSelectionRange(pos, pos + (l[n - 1] || '').length); }
    };
  }

  // ---------- results ----------
  function tabelaResultado(res, rotulo) {
    if (res.colunas && res.colunas.length === 1 && res.colunas[0] === 'QUERY PLAN') {
      return '<div class="res-bloco"><div class="res-cab">' + rotulo + ' · ' + esc(L.planoExec) + '</div><pre class="plano">' + esc(res.linhas.map(l => l[0]).join('\n')) + '</pre></div>';
    }
    if (!res.colunas) return '<div class="res-bloco"><div class="res-cab">' + rotulo + ' · ' + esc(res.tag || L.executado) + '</div></div>';
    const max = 200, linhas = res.linhas.slice(0, max);
    const numerica = res.colunas.map((_, j) => res.linhas.length > 0 && res.linhas.every(l => l[j] === null || /^-?\d+(\.\d+)?$/.test(l[j])));
    return '<div class="res-bloco"><div class="res-cab">' + rotulo + ' · ' + esc(L.linhas(res.linhas.length)) +
      (res.tag ? ' · ' + esc(res.tag) : '') + (res.linhas.length > max ? esc(L.mostrando(max)) : '') + '</div><div class="tabela grade"><table><tr>' +
      res.colunas.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr>' +
      linhas.map(l => '<tr>' + l.map((v, j) => '<td' + (numerica[j] ? ' class="num"' : '') + '>' + (v === null ? '<span class="nulo">NULL</span>' : esc(v)) + '</td>').join('') + '</tr>').join('') +
      '</table></div></div>';
  }

  function celula(opts) {
    const frag = document.createElement('div');
    const variantes = (opts.variantes || []).filter(v => v.lang !== 'sql');
    let abas = null;
    if (variantes.length) {
      abas = document.createElement('div'); abas.className = 'abas';
      abas.innerHTML = ['sql', ...variantes.map(v => v.lang)].map((l, i) => '<button class="aba' + (i ? '' : ' ativa') + '" data-l="' + l + '">' + NOMES_DIALETO[l] + '</button>').join('') +
        '<span class="aba-dica">' + esc(L.soPostgres) + '</span>';
      frag.appendChild(abas);
    }
    const ed = criarEditor(opts.id, opts.codigo, false, 'sql');
    frag.appendChild(ed.el);
    const outros = {};
    variantes.forEach(v => {
      const e = criarEditor(opts.id + '-' + v.lang, v.code, true, 'sql');
      e.el.style.display = 'none'; e.el.classList.add('variante'); outros[v.lang] = e; frag.appendChild(e.el);
    });
    const acoes = document.createElement('div'); acoes.className = 'acoes';
    acoes.innerHTML = '<button class="btn prim btn-run"' + (pronto ? '' : ' disabled') + '>' + esc(L.executar) + '</button>' +
      (opts.desafio ? '<button class="btn ok btn-run btn-verif"' + (pronto ? '' : ' disabled') + '>' + esc(L.verificar) + '</button>' : '<button class="btn btn-run btn-plano"' + (pronto ? '' : ' disabled') + '>' + esc(L.plano) + '</button>') +
      '<button class="btn btn-reset">' + esc(L.restaurar) + '</button>' + (opts.desafio ? '<button class="btn btn-sol">' + esc(L.verSolucao) + '</button>' : '') +
      '<span class="atalho">' + (opts.desafio ? L.atalhoDesafio : L.atalho) + '</span>';
    frag.appendChild(acoes);
    const saida = document.createElement('div'); saida.className = 'saida-sql'; frag.appendChild(saida);
    const resultado = document.createElement('div'); resultado.className = 'resultado'; resultado.setAttribute('role', 'status'); frag.appendChild(resultado);
    let solDiv = null;
    if (opts.desafio) {
      solDiv = document.createElement('div'); solDiv.className = 'solucao';
      solDiv.innerHTML = '<div class="rotulo-sol">' + esc(L.solucao) + '</div><div class="estatico editor"><pre>' + realce(opts.solucao, 'sql') + '</pre></div><div class="acoes"><button class="btn btn-usar">' + esc(L.copiar) + '</button></div>';
      frag.appendChild(solDiv);
      solDiv.querySelector('.btn-usar').onclick = () => ed.definir(opts.solucao);
    }
    if (abas) abas.addEventListener('click', e => {
      const b = e.target.closest('.aba'); if (!b) return;
      abas.querySelectorAll('.aba').forEach(x => x.classList.toggle('ativa', x === b));
      ed.el.style.display = b.dataset.l === 'sql' ? '' : 'none';
      Object.entries(outros).forEach(([l, e2]) => e2.el.style.display = l === b.dataset.l ? '' : 'none');
      acoes.style.display = b.dataset.l === 'sql' ? '' : 'none';
    });

    async function executar(modo) {
      if (!pronto) return;
      const botoes = acoes.querySelectorAll('.btn-run'); botoes.forEach(b => b.disabled = true);
      saida.innerHTML = '<div class="res-cab">' + esc(L.executando) + '</div>'; saida.classList.add('vis'); resultado.className = 'resultado'; ed.marcarErro(0);
      const t0 = performance.now();
      let res;
      try {
        res = await api('api/executar', { sql: ed.valor(), explicar: modo === 'plano',
          esperado: modo === 'verificar' ? opts.solucao : undefined, ordenado: !!opts.ordenado });
      } catch (e) { res = { ok: false, resultados: [], erro: { mensagem: L.semServidor } }; }
      botoes.forEach(b => b.disabled = false);
      const ms = Math.round(performance.now() - t0);
      let html = (res.resultados || []).map(r => tabelaResultado(r, esc(L.comando(r.comando + 1)))).join('');
      if (res.erro) {
        html += '<div class="tb">' + (res.erro.linha ? '<a data-l="' + res.erro.linha + '">' + esc(L.linha(res.erro.linha)) + '</a> · ' : '') + esc(traduzErro(res.erro.mensagem)) + '</div>';
        if (res.erro.linha) ed.marcarErro(res.erro.linha);
      }
      saida.innerHTML = (html || '<div class="res-cab">' + esc(L.nada) + '</div>') + '<div class="res-rodape">' + esc(L.rodape(ms)) + '</div>';
      saida.querySelectorAll('a[data-l]').forEach(a => a.onclick = () => ed.irPara(+a.dataset.l));
      if (modo === 'verificar') {
        const v = res.verificacao;
        if (v && v.ok) { resultado.className = 'resultado vis ok'; resultado.textContent = L.sucesso; marcar(opts.id); }
        else { resultado.className = 'resultado vis falha'; resultado.textContent = L.aindaNao(v ? traduzMotivo(v.motivo) : L.comErro); }
      } else if (!opts.desafio && res.ok) marcar(opts.id);
    }
    acoes.querySelector('.btn-run').onclick = () => executar('normal');
    if (opts.desafio) acoes.querySelector('.btn-verif').onclick = () => executar('verificar');
    else acoes.querySelector('.btn-plano').onclick = () => executar('plano');
    acoes.querySelector('.btn-reset').onclick = () => { ed.definir(opts.codigo); saida.classList.remove('vis'); resultado.className = 'resultado'; };
    if (solDiv) acoes.querySelector('.btn-sol').onclick = () => { if (solDiv.classList.contains('vis') || confirm(L.confirmaSol)) solDiv.classList.toggle('vis'); };
    ed.ta.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); executar(opts.desafio && e.shiftKey ? 'verificar' : 'normal'); } });
    return frag;
  }

  // ---------- rendering ----------
  function estatico(code, lang) { const d = document.createElement('div'); d.className = 'estatico editor'; d.innerHTML = '<pre>' + realce(code, lang) + '</pre>'; return d; }
  function renderCapitulo(ci) {
    const cap = DADOS.capitulos[ci];
    conteudo.innerHTML = '<div class="kicker">' + esc(L.capitulo(ci + 1, DADOS.capitulos.length)) + '</div><h2 class="cap">' + esc(cap.titulo) + '</h2>';
    let lista = null;
    cap.blocos.forEach(b => {
      if (b.t !== 'bullet') lista = null;
      let el = null;
      switch (b.t) {
        case 'h2': el = document.createElement('h3'); el.className = 'sec'; el.id = b.ancora; el.innerHTML = inline(b.text); break;
        case 'h3': el = document.createElement('h4'); el.innerHTML = inline(b.text); break;
        case 'p': el = document.createElement('p'); el.innerHTML = inline(b.text); break;
        case 'bullet':
          if (!lista) { lista = document.createElement('ul'); lista.className = 'lista'; conteudo.appendChild(lista); }
          const li = document.createElement('li'); li.innerHTML = inline(b.text); lista.appendChild(li); return;
        case 'note':
          el = document.createElement('div'); el.className = 'nota ' + b.kind;
          el.innerHTML = '<div class="ic">' + esc(L.notas[b.kind] || UI.pt.notas[b.kind] || b.kind) + '</div><div class="tx">' + inline(b.text) + '</div>';
          break;
        case 'table':
          el = document.createElement('div'); el.className = 'tabela';
          el.innerHTML = '<table>' + b.rows.map((r, i) => '<tr>' + r.map(c => (i ? '<td>' : '<th>') + inline(c) + (i ? '</td>' : '</th>')).join('') + '</tr>').join('') + '</table>';
          break;
        case 'code': el = document.createElement('div'); el.style.margin = '0 0 18px'; el.appendChild(b.lang === 'sql' ? celula({ id: 'c-' + ci + '-' + b.code.length, codigo: b.code }) : estatico(b.code, b.lang)); break;
        case 'ex': {
          el = document.createElement('div'); el.className = 'ex';
          el.innerHTML = '<div class="kicker">' + esc(L.exemplo) + '</div><div class="titulo">' + inline(b.titulo) + '</div><div class="meta"><span class="arquivo">' + esc(b.arquivo) + '</span></div>';
          if (b.lang === 'sql') el.appendChild(celula({ id: b.id, codigo: b.code, variantes: b.variantes }));
          else {
            const blocos = [{ lang: b.lang, code: b.code }, ...(b.variantes || [])];
            blocos.forEach(v => {
              if (blocos.length > 1) { const r = document.createElement('div'); r.className = 'arquivo rotulo-bloco'; r.textContent = NOMES_DIALETO[v.lang] || v.lang; el.appendChild(r); }
              el.appendChild(estatico(v.code, v.lang));
            });
          }
          if (b.callouts.length) {
            const ul = document.createElement('ul'); ul.className = 'callouts';
            ul.innerHTML = b.callouts.map((c, i) => '<li><span class="n">' + CIRC[i] + '</span><span>' + inline(c) + '</span></li>').join('');
            el.appendChild(ul);
          }
          break;
        }
        case 'desafio': {
          const pratica = b.pratica || !b.solucao;
          el = document.createElement('div'); el.className = 'ex desafio';
          el.innerHTML = '<div class="kicker">' + esc(pratica ? L.pratica : L.desafio) + '</div><div class="titulo">' + inline(b.titulo) + '</div><div class="enunciado">' + inline(b.enunciado) + (b.ordenado ? ' <i>' + esc(L.ordemVerificada) + '</i>' : '') + '</div>';
          if (pratica) {
            // chapter 8 (the English case study, "Step N") keeps its own English hint in every language
            const selo = /^Step /.test(b.titulo) ? UI.en.seloPratica : L.seloPratica;
            el.querySelector('.titulo').insertAdjacentHTML('afterend', '<div class="selo-pratica">' + esc(selo) + '</div>');
            el.appendChild(celula({ id: b.id, codigo: b.inicial }));
          } else el.appendChild(celula({ id: b.id, codigo: b.inicial, solucao: b.solucao, ordenado: b.ordenado, desafio: true }));
          break;
        }
      }
      if (el) conteudo.appendChild(el);
    });
    const pag = document.createElement('div'); pag.className = 'paginacao';
    pag.innerHTML = (ci > 0 ? '<a href="#cap-' + ci + '">← ' + esc(DADOS.capitulos[ci - 1].titulo) + '</a>' : '<a href="#inicio">← ' + esc(L.inicio) + '</a>') +
      (ci < DADOS.capitulos.length - 1 ? '<a href="#cap-' + (ci + 2) + '">' + esc(DADOS.capitulos[ci + 1].titulo) + ' →</a>' : '<a href="#console">' + esc(L.console) + ' →</a>');
    conteudo.appendChild(pag);
    $('tituloMobile').textContent = cap.titulo;
  }
  function renderInicio() {
    conteudo.innerHTML = '<div class="inicio"><h2>' + esc(L.titulo) + '</h2><div class="sub">' + esc(DADOS.subtitulo) + '</div>' +
      '<div class="prompt">$ ' + L.prompt + '</div>' +
      '<div class="label"><span>' + esc(L.comoUsar) + '</span></div>' +
      '<div class="como"><ul>' + L.como.map(li => '<li>' + li + '</li>').join('') + '</ul></div>' +
      '<div class="label"><span>' + esc(L.rotCards) + '</span></div><div class="cards">' +
      DADOS.capitulos.map((c, i) => {
        const f = c.atividades.filter(id => estado.feitos[id]).length, t = c.atividades.length;
        return '<a class="card" href="#cap-' + (i + 1) + '"><span class="num-cap">cap-' + (i + 1) + '</span><b>' + esc(c.titulo) + '</b><small>' + f + '/' + esc(L.atividades(t)) + '</small>' +
          '<span class="mini"><span style="width:' + (t ? 100 * f / t : 0) + '%"></span></span></a>';
      }).join('') +
      '<a class="card" href="#console"><span class="num-cap">console</span><b>' + esc(L.console) + '</b><small>' + esc(L.consoleSub) + '</small></a></div></div>';
    $('tituloMobile').textContent = L.titulo;
  }
  function renderConsole() {
    conteudo.innerHTML = '<div class="kicker">console</div><h2 class="cap">' + esc(L.console) + '</h2><p>' + L.consoleTexto + '</p>';
    const d = document.createElement('div'); d.className = 'ex';
    d.appendChild(celula({ id: 'console', codigo: "SELECT status, count(*) AS pedidos\nFROM pedidos\nGROUP BY status\nORDER BY pedidos DESC;\n" }));
    conteudo.appendChild(d);
    $('tituloMobile').textContent = L.console;
  }

  const nav = $('nav');
  nav.innerHTML = '<a href="#inicio" class="cap">' + esc(L.inicio) + '</a>' + DADOS.capitulos.map((c, i) =>
    '<a class="cap" data-cap="' + i + '" href="#cap-' + (i + 1) + '"><span>' + esc(c.titulo) + '</span><span class="cnt"></span></a>' +
    c.secoes.map(s => '<a class="sec" href="#cap-' + (i + 1) + '" data-ancora="' + s.ancora + '">' + inline(s.titulo) + '</a>').join('')).join('') +
    '<a class="cap" href="#console">' + esc(L.console) + '</a>';
  DADOS.capitulos.forEach(c => atividades.push(...c.atividades));
  let ancora = null;
  nav.addEventListener('click', e => { const a = e.target.closest('a'); if (!a) return; ancora = a.dataset.ancora || null; $('menu').classList.remove('aberto'); if (a.getAttribute('href') === location.hash) { e.preventDefault(); rotear(); } });
  function rotear() {
    const h = location.hash.slice(1) || 'inicio', m = h.match(/^cap-(\d+)$/);
    nav.querySelectorAll('a.cap').forEach(a => a.classList.toggle('ativo', a.getAttribute('href') === '#' + h));
    if (m && DADOS.capitulos[+m[1] - 1]) renderCapitulo(+m[1] - 1); else if (h === 'console') renderConsole(); else renderInicio();
    const alvo = ancora && document.getElementById(ancora); if (alvo) alvo.scrollIntoView(); else $('main').scrollTop = 0; ancora = null;
  }
  window.addEventListener('hashchange', rotear);
  rotear(); atualizarProgresso(); iniciar();
  }
})();
</script>
</body>
</html>
