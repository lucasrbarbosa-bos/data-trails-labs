<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SQL Moderno — Laboratório</title>
<style>
/* Colours, font and the top bar come from the hub (/hub/theme.css, themes dark · light · dracula).
  The page keeps its old variable names as aliases of the shared --th-* tokens. */
:root {
  --bg: var(--th-main);
  --bg-2: var(--th-side);
  --bg-ex: var(--th-surface);
  --bg-ex-2: var(--th-surface-2);
  --bg-code: var(--th-code);
  --line: var(--th-line);
  --line-2: var(--th-line-2);
  --ink: var(--th-ink);
  --ink-2: var(--th-ink-2);
  --ink-3: var(--th-ink-3);
  --accent: var(--th-accent);
  --accent-2: var(--th-accent-bg);
  --on-accent: var(--th-on-accent);
  --link: var(--th-link);
  --ok: var(--th-ok);
  --ok-bg: var(--th-ok-bg);
  --err: var(--th-err);
  --err-bg: var(--th-err-bg);
  --warn: var(--th-warn);
  --warn-bg: var(--th-warn-bg);
  --info: var(--th-info);
  --info-bg: var(--th-info-bg);
  --kw: var(--th-kw);
  --str: var(--th-str);
  --com: var(--th-com);
  --num: var(--th-num);
  --bi: var(--th-bi);
  --fn: var(--th-fn);
  --mono: var(--th-mono, ui-monospace, 'SF Mono', Menlo, Consolas, monospace);
  --bar-h: var(--th-bar-h, 0px);
}
* {
  box-sizing: border-box;
}
html {
  height: 100%;
  -webkit-text-size-adjust: 100%;
}
body {
  margin: 0;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 14.5px;
  line-height: 1.75;
}
button,
input,
textarea,
select {
  font-family: inherit;
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
a {
  color: var(--link);
}

/* ---------- layout: top bar (hub) + sidebar + reading area, each scrolling on its own ---------- */
.app {
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
  height: calc(100dvh - var(--bar-h));
  overflow: hidden;
}
aside {
  background: var(--bg-2);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  padding: 22px 16px 40px;
  font-size: 13px;
  line-height: 1.5;
}
main {
  background: var(--bg);
  overflow-y: auto;
  height: 100%;
  min-width: 0;
}
.content {
  max-width: 880px;
  margin: 0 auto;
  padding: 34px 32px 120px;
}

/* ---------- sidebar ---------- */
.brand {
  font-size: 11.5px;
  color: var(--ink-3);
  margin-bottom: 6px;
}
.brand::before {
  content: "$ ";
  color: var(--accent);
}
aside h1 {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.25;
  margin: 0 0 4px;
}
aside .sub {
  color: var(--ink-2);
  font-size: 12px;
  margin-bottom: 16px;
}
.eyebrow {
  display: block;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 18px 0 8px;
}
.progress {
  margin: 6px 0 14px;
}
.progress-bar {
  height: 3px;
  background: var(--line);
  border-radius: 2px;
  overflow: hidden;
  margin: 2px 0 6px;
}
.progress-bar > div {
  height: 100%;
  background: var(--ok);
  width: 0;
  transition: width .4s;
}
.progress small {
  color: var(--ink-2);
  font-size: 11.5px;
}
nav a {
  display: block;
  color: var(--ink-2);
  text-decoration: none;
  padding: 5px 8px;
  border-radius: 6px;
  font-size: 12.5px;
  line-height: 1.4;
}
nav a:hover {
  background: var(--bg-ex);
  color: var(--ink);
}
nav a.chapter {
  color: var(--ink);
  font-weight: 600;
  margin-top: 6px;
  display: flex;
  justify-content: space-between;
  gap: 8px;
}
nav a.chapter.active {
  background: var(--accent);
  color: var(--on-accent);
}
nav a.sec {
  padding-left: 20px;
  font-size: 12px;
}
nav a.sec::before {
  content: "› ";
  color: var(--ink-3);
}
nav a .cnt {
  font-weight: 400;
  color: var(--ink-3);
  font-size: 11px;
  white-space: nowrap;
}
nav a .cnt.full {
  color: var(--ok);
}
nav a.chapter.active .cnt {
  color: var(--on-accent);
  opacity: .75;
}
.schema {
  margin-top: 14px;
  font-size: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
}
.schema summary {
  cursor: pointer;
  font-weight: 700;
  padding: 7px 10px;
  border-radius: 8px;
  font-size: 10.5px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.schema summary:hover {
  color: var(--ink);
  background: var(--bg-ex);
}
.schema[open] summary {
  border-bottom: 1px solid var(--line);
  border-radius: 8px 8px 0 0;
}
#schema {
  padding: 4px 10px 10px;
  max-height: 50vh;
  overflow-y: auto;
}
#schema small {
  color: var(--ink-3);
}
.schema-table {
  margin: 8px 0 0;
}
.schema-table b {
  display: block;
  font-size: 12px;
  color: var(--ink);
}
.schema-table b::before {
  content: "▸ ";
  color: var(--ink-3);
}
.schema-table div {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding-left: 14px;
  font-size: 11.5px;
  color: var(--ink-2);
}
.schema-table em {
  color: var(--bi);
  font-style: normal;
}
.engine {
  margin-top: 18px;
  font-size: 11.5px;
  color: var(--ink-2);
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.engine i {
  flex: 0 0 auto;
  width: 7px;
  height: 7px;
  margin-top: 5px;
  border-radius: 50%;
  background: var(--warn);
  display: inline-block;
}
.engine.ready i {
  background: var(--ok);
  box-shadow: 0 0 0 3px var(--ok-bg);
}
.engine.failed i {
  background: var(--err);
}

/* ---------- mobile top line inside the reading area ---------- */
.mobile-top {
  display: none;
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--bg-2);
  border-bottom: 1px solid var(--line);
  padding: 8px 16px;
  align-items: center;
  gap: 10px;
  font-size: 13px;
}
.mobile-top b {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.mobile-top button {
  background: var(--bg-ex);
  border: 1px solid var(--line);
  color: var(--ink);
  border-radius: 6px;
  padding: 3px 10px;
  font-size: 15px;
  cursor: pointer;
}

/* ---------- reading area ---------- */
.kicker {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 0 0 6px;
}
.kicker::before {
  content: "# ";
  color: var(--accent);
}
h2.chapter {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.25;
  margin: 0 0 26px;
}
h3.sec {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1.35;
  margin: 44px 0 14px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
}
h3.sec::before {
  content: "## ";
  color: var(--ink-3);
  font-weight: 400;
}
h4 {
  font-size: 15.5px;
  font-weight: 700;
  margin: 28px 0 10px;
}
h4::before {
  content: "### ";
  color: var(--ink-3);
  font-weight: 400;
}
p {
  margin: 0 0 16px;
  text-align: left;
}
ul.list {
  margin: 0 0 16px;
  padding-left: 22px;
}
ul.list li {
  margin-bottom: 6px;
}
ul.list li::marker {
  content: "- ";
  color: var(--ink-3);
}
code {
  font-family: var(--mono);
  font-size: .9em;
  background: var(--bg-ex-2);
  border: 1px solid var(--line);
  padding: 0 5px;
  border-radius: 4px;
}
.table {
  overflow-x: auto;
  margin: 0 0 20px;
}
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13px;
  line-height: 1.55;
}
th,
td {
  border: 1px solid var(--line);
  padding: 7px 10px;
  text-align: left;
  vertical-align: top;
}
th {
  background: var(--bg-ex);
  font-weight: 700;
}
.note {
  margin: 22px 0;
  border: 1px solid var(--line);
  border-left: 3px solid var(--k, var(--info));
  border-radius: 8px;
  background: var(--bg-ex);
  padding: 10px 16px 12px;
}
.note .note-title {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--k, var(--info));
  margin-bottom: 2px;
}
.note .tx {
  text-align: left;
}
.note.NOTE {
  --k: var(--info);
}
.note.WARNING {
  --k: var(--err);
}
.note.TIP {
  --k: var(--ok);
}
.note.NEW {
  --k: var(--warn);
}
.ex {
  background: var(--bg-ex);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px 20px 16px;
  margin: 26px 0;
}
.ex .kicker {
  margin-bottom: 4px;
}
.ex.challenge .kicker::before {
  content: "$ ";
}
.ex .title {
  font-weight: 700;
  font-size: 15px;
  line-height: 1.45;
  margin-bottom: 4px;
}
.ex .meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin: 4px 0 8px;
  flex-wrap: wrap;
}
.file {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink-3);
}
.ex .prompt {
  margin: 8px 0 12px;
}
.callouts {
  list-style: none;
  padding: 0;
  margin: 12px 0 0;
  font-size: 13.5px;
}
.callouts li {
  display: grid;
  grid-template-columns: 24px 1fr;
  gap: 6px;
  margin-bottom: 6px;
  text-align: left;
}
.callouts .n {
  color: var(--accent);
}

/* ---------- editors ---------- */
.editor {
  position: relative;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg-code);
  overflow: hidden;
}
.editor:focus-within {
  border-color: var(--accent);
}
.ed-wrap {
  display: grid;
  grid-template-columns: auto 1fr;
  overflow-x: auto;
}
.gutter {
  font-family: var(--mono);
  font-size: 13px;
  line-height: 21px;
  color: var(--ink-3);
  text-align: right;
  padding: 12px 8px 12px 10px;
  user-select: none;
  border-right: 1px solid var(--line);
  background: var(--bg-code);
  white-space: pre;
}
.gutter .error {
  color: var(--err);
  font-weight: 700;
}
.area {
  position: relative;
  min-width: 0;
}
.area pre,
.area textarea {
  margin: 0;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 21px;
  padding: 12px 14px;
  white-space: pre;
  tab-size: 4;
  border: 0;
  letter-spacing: 0;
  font-variant-ligatures: none;
}
.area pre {
  pointer-events: none;
  color: var(--ink);
  min-height: 100%;
}
.area textarea {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  resize: none;
  background: transparent;
  color: transparent;
  caret-color: var(--ink);
  outline: none;
  overflow: hidden;
}
.area textarea::selection {
  background: var(--th-select, rgba(120, 150, 220, .35));
  color: transparent;
}
.static-code pre {
  margin: 0;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 21px;
  padding: 12px 14px;
  overflow-x: auto;
  white-space: pre;
  color: var(--ink);
}
.tk-kw {
  color: var(--kw);
}
.tk-str {
  color: var(--str);
}
.tk-com {
  color: var(--com);
  font-style: italic;
}
.tk-num {
  color: var(--num);
}
.tk-bi {
  color: var(--bi);
}
.tk-fn {
  color: var(--fn);
}
.error-line {
  background: var(--err-bg);
  display: inline-block;
  width: 100%;
}
.tabs {
  display: flex;
  gap: 4px;
  align-items: flex-end;
  margin-bottom: -1px;
  flex-wrap: wrap;
  position: relative;
  z-index: 1;
}
.tab {
  border: 1px solid var(--line);
  border-bottom: 0;
  background: var(--bg-ex-2);
  color: var(--ink-2);
  border-radius: 6px 6px 0 0;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
}
.tab:hover {
  color: var(--ink);
}
.tab.active {
  background: var(--bg-code);
  color: var(--ink);
  font-weight: 700;
}
.tab-hint {
  margin-left: auto;
  font-size: 11px;
  color: var(--ink-3);
  padding-bottom: 4px;
}
.variant .area textarea {
  cursor: default;
}

/* ---------- buttons and output ---------- */
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 10px 0 0;
  align-items: center;
}
.btn {
  border: 1px solid var(--line-2);
  background: var(--bg-ex-2);
  color: var(--ink);
  border-radius: 6px;
  padding: 5px 12px;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  line-height: 1.4;
}
.btn:hover {
  border-color: var(--accent);
}
.btn.prim {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
  font-weight: 700;
}
.btn.prim:hover {
  filter: brightness(1.08);
}
.btn.ok {
  background: var(--ok-bg);
  border-color: var(--ok);
  color: var(--ok);
  font-weight: 700;
}
.btn:disabled {
  opacity: .5;
  cursor: progress;
}
.shortcut {
  font-size: 11px;
  color: var(--ink-3);
  margin-left: auto;
}
kbd {
  font-family: var(--mono);
  font-size: 11px;
  border: 1px solid var(--line-2);
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: 0 5px;
  background: var(--bg-ex-2);
  color: var(--ink);
}
.result {
  margin-top: 10px;
  padding: 9px 14px;
  border-radius: 8px;
  font-size: 13px;
  display: none;
  border: 1px solid transparent;
}
.result.vis {
  display: block;
}
.result.ok {
  background: var(--ok-bg);
  color: var(--ok);
  border-color: var(--ok);
}
.result.fail {
  background: var(--warn-bg);
  color: var(--warn);
  border-color: var(--warn);
}
.solution {
  margin-top: 12px;
  display: none;
}
.solution.vis {
  display: block;
}
.output-sql {
  margin-top: 10px;
  display: none;
}
.output-sql.vis {
  display: block;
}
.res-block {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg-code);
  margin-bottom: 8px;
  overflow: hidden;
}
.res-head {
  padding: 6px 12px;
  font-size: 11.5px;
  color: var(--ink-2);
  border-bottom: 1px solid var(--line);
  background: var(--bg-ex-2);
}
.res-head::before {
  content: "> ";
  color: var(--accent);
}
.res-block .res-head:only-child {
  border-bottom: 0;
}
.output-sql > .res-head {
  border: 1px solid var(--line);
  border-radius: 8px;
}
.res-footer {
  font-size: 11px;
  color: var(--ink-3);
  margin: 2px 2px 0;
}
.grid {
  margin: 0;
  max-height: 380px;
  overflow: auto;
}
.grid table {
  font-family: var(--mono);
  font-size: 12.5px;
  border: 0;
}
.grid th {
  position: sticky;
  top: 0;
  background: var(--bg-ex-2);
  font-size: 12px;
}
.grid th,
.grid td {
  border-width: 0 1px 1px 0;
  white-space: nowrap;
  padding: 4px 10px;
}
.grid td.num {
  text-align: right;
  color: var(--num);
}
.null-value {
  color: var(--ink-3);
  font-style: italic;
}
.plan {
  margin: 0;
  padding: 10px 12px;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.6;
  white-space: pre;
  overflow-x: auto;
  color: var(--ink);
}
.output-sql .tb {
  color: var(--err);
  background: var(--err-bg);
  border: 1px solid var(--err);
  border-radius: 8px;
  padding: 10px 12px;
  font-family: var(--mono);
  font-size: 12.5px;
  white-space: pre-wrap;
  margin-bottom: 8px;
}
.output-sql .tb a {
  color: var(--err);
  font-weight: 700;
  text-decoration: underline;
  cursor: pointer;
}
.block-label {
  margin: 12px 0 4px;
}
.practice-badge {
  font-size: 11.5px;
  color: var(--warn);
  margin: 0 0 8px;
}
.practice-badge::before {
  content: "! ";
  font-weight: 700;
}
.solution-label {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 0 0 6px;
}

/* ---------- pagination, home view ---------- */
.pagination {
  display: flex;
  justify-content: space-between;
  margin-top: 50px;
  gap: 12px;
  flex-wrap: wrap;
}
.pagination a {
  color: var(--link);
  text-decoration: none;
  border: 1px solid var(--line);
  background: var(--bg-ex);
  border-radius: 8px;
  padding: 9px 14px;
  font-size: 13px;
}
.pagination a:hover {
  border-color: var(--line-2);
  background: var(--bg-ex-2);
}
.loading {
  color: var(--ink-3);
  font-size: 13px;
  padding-top: 20px;
}
.loading::before {
  content: "$ ";
  color: var(--accent);
}
.notice {
  border: 1px dashed var(--line-2);
  border-radius: 8px;
  padding: 18px 20px;
  color: var(--ink-2);
  margin-top: 20px;
}
.notice strong {
  color: var(--ink);
  display: block;
  margin-bottom: 4px;
}
.home {
  padding-top: 18px;
}
.home h2 {
  font-size: clamp(28px, 5vw, 40px);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.15;
  margin: 0 0 8px;
}
.home .sub {
  color: var(--ink-2);
  margin-bottom: 8px;
}
.home .prompt {
  color: var(--ink-3);
  font-size: 12px;
  margin-bottom: 26px;
}
.home .prompt em {
  color: var(--ok);
  font-style: normal;
}
.label {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 30px 0 16px;
  color: var(--ink-2);
  font-size: 11.5px;
}
.label::before,
.label::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line);
}
.label span {
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 12px;
  background: var(--bg);
}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr));
  gap: 12px;
  text-align: left;
}
.card {
  position: relative;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px 16px;
  text-decoration: none;
  color: var(--ink);
  background: var(--bg-ex);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition: border-color .15s, background .15s;
}
.card:hover {
  border-color: var(--line-2);
  background: var(--bg-ex-2);
}
.card .chapter-num {
  font-size: 11px;
  color: var(--th-postgres, var(--accent));
}
.card .chapter-num::before {
  content: "$ ";
  color: var(--ink-3);
}
.card b {
  display: block;
  font-size: 14px;
  line-height: 1.4;
}
.card small {
  color: var(--ink-3);
  font-size: 11.5px;
  margin-top: auto;
}
.card .mini {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 3px;
  background: var(--line);
}
.card .mini span {
  display: block;
  height: 100%;
  background: var(--ok);
  width: 0;
}
.how {

  function highlight(code, lang) {
    if (lang === 'text' || lang === 'yaml') return esc(code);
    let out = '', lastIndex = 0;
    code.replace(TOKEN, (m, com, str, ident, num, cast, name, pos) => {
      out += esc(code.slice(lastIndex, pos));
      let cls = null;
      if (com) cls = 'com'; else if (str) cls = 'str'; else if (num) cls = 'num'; else if (cast) cls = 'bi';
      else if (name) { const l = name.toLowerCase(); if (KW.has(l)) cls = 'kw'; else if (FN.has(l)) cls = 'fn'; }
      out += cls ? '<span class="tk-' + cls + '">' + esc(m) + '</span>' : esc(m);
      lastIndex = pos + m.length; return m;
    });
    return out + esc(code.slice(lastIndex));
  }

  const setEngineStatus = (c, t) => { engineEl.className = 'engine ' + c; engineEl.querySelector('span').textContent = t; };
  async function api(path, body) {

    try {
      const st = await api('api/status');
      if (!st.postgres) throw new Error(st.error || L.noResponse);
      setEngineStatus('ready', L.engineReady(st.postgres));
      ready = true;
      document.querySelectorAll('.btn-run').forEach(b => b.disabled = false);
      const schema = await api('api/schema');
      $('schema').innerHTML = Object.entries(schema.tables || {}).map(([t, cols]) =>
        '<div class="schema-table"><b>' + esc(t) + '</b>' + cols.map(([c, kind]) => '<div><span>' + esc(c) + '</span><em>' + esc(kind) + '</em></div>').join('') + '</div>').join('');
    } catch (e) {
      setEngineStatus('failed', L.engineFailed(e.message));
    }
  }

  // ---------- progress ----------
  const activities = [];
  function updateProgress() {
    const total = activities.length, done = activities.filter(id => state.done[id]).length;
    $('progress-bar').style.width = (total ? 100 * done / total : 0) + '%';
    $('progressText').textContent = L.progress(done, total);
    if (window.TRAIL && window.TRAIL.progress) window.TRAIL.progress(done, total);
    BOOK.chapters.forEach((chapter, i) => {
      const f = chapter.activities.filter(id => state.done[id]).length;
      const el = document.querySelector('#nav a[data-chapter="' + i + '"] .cnt');
      if (el) { el.textContent = f + '/' + chapter.activities.length; el.classList.toggle('full', f === chapter.activities.length && f > 0); }
    });
  }
  const markDone = id => { if (!state.done[id]) { state.done[id] = true; save(); updateProgress(); } };

  // ---------- editor ----------
  function createEditor(id, starter, readOnly, lang) {
    const box = document.createElement('div'); box.className = 'editor';
    box.innerHTML = '<div class="ed-wrap"><div class="gutter"></div><div class="area"><pre aria-hidden="true"></pre><textarea spellcheck="false" autocapitalize="off" autocomplete="off"></textarea></div></div>';
    const ta = box.querySelector('textarea'), pre = box.querySelector('pre'), gut = box.querySelector('.gutter');
    ta.setAttribute('aria-label', readOnly ? L.readOnlyEditor : L.sqlEditor);
    const saved = readOnly ? null : state.savedCode[id];
    ta.value = saved != null ? saved : starter;
    ta.readOnly = !!readOnly;
    let errorLine = 0;
    function paint() {
      const lines = ta.value.split('\n');
      let html = highlight(ta.value, lang || 'sql');
      if (errorLine) { const p = html.split('\n'); if (p[errorLine - 1] !== undefined) p[errorLine - 1] = '<span class="error-line">' + (p[errorLine - 1] || ' ') + '</span>'; html = p.join('\n'); }
      pre.innerHTML = html + '\n';
      gut.innerHTML = lines.map((_, i) => i + 1 === errorLine ? '<span class="error">' + (i + 1) + '</span>' : (i + 1)).join('\n');
      pre.style.minWidth = 'calc(' + (Math.max(...lines.map(l => l.length)) + 2) + 'ch + 28px)';
    }
    ta.addEventListener('input', () => { errorLine = 0; paint(); if (!readOnly) { state.savedCode[id] = ta.value; save(); } });
    ta.addEventListener('keydown', e => {
      if (e.key === 'Tab' && !readOnly) { e.preventDefault(); ta.setRangeText('    ', ta.selectionStart, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input')); }
    });
    paint();
    return {
      el: box, ta, value: () => ta.value,
      setValue: v => { ta.value = v; errorLine = 0; paint(); state.savedCode[id] = v; save(); },
      markError: n => { errorLine = n; paint(); },
      goToLine: n => { const l = ta.value.split('\n'); let pos = 0; for (let i = 0; i < n - 1 && i < l.length; i++) pos += l[i].length + 1; ta.focus(); ta.setSelectionRange(pos, pos + (l[n - 1] || '').length); }
    };
  }

  // ---------- results ----------
  function resultTable(res, label) {
    if (res.columns && res.columns.length === 1 && res.columns[0] === 'QUERY PLAN') {
      return '<div class="res-block"><div class="res-head">' + label + ' · ' + esc(L.execPlan) + '</div><pre class="plan">' + esc(res.rows.map(l => l[0]).join('\n')) + '</pre></div>';
    }
    if (!res.columns) return '<div class="res-block"><div class="res-head">' + label + ' · ' + esc(res.tag || L.executed) + '</div></div>';
    const max = 200, rows = res.rows.slice(0, max);
    const numeric = res.columns.map((_, j) => res.rows.length > 0 && res.rows.every(l => l[j] === null || /^-?\d+(\.\d+)?$/.test(l[j])));
    return '<div class="res-block"><div class="res-head">' + label + ' · ' + esc(L.rows(res.rows.length)) +
      (res.tag ? ' · ' + esc(res.tag) : '') + (res.rows.length > max ? esc(L.showing(max)) : '') + '</div><div class="table grid"><table><tr>' +
      res.columns.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr>' +
      rows.map(l => '<tr>' + l.map((v, j) => '<td' + (numeric[j] ? ' class="num"' : '') + '>' + (v === null ? '<span class="null-value">NULL</span>' : esc(v)) + '</td>').join('') + '</tr>').join('') +
      '</table></div></div>';
  }

  function cell(opts) {
    const frag = document.createElement('div');
    const variants = (opts.variants || []).filter(v => v.lang !== 'sql');
    let tabs = null;
    if (variants.length) {
      tabs = document.createElement('div'); tabs.className = 'tabs';
      tabs.innerHTML = ['sql', ...variants.map(v => v.lang)].map((l, i) => '<button class="tab' + (i ? '' : ' active') + '" data-l="' + l + '">' + DIALECT_NAMES[l] + '</button>').join('') +
        '<span class="tab-hint">' + esc(L.postgresOnly) + '</span>';
      frag.appendChild(tabs);
    }
    const ed = createEditor(opts.id, opts.code, false, 'sql');
    frag.appendChild(ed.el);
    const others = {};
    variants.forEach(v => {
      const e = createEditor(opts.id + '-' + v.lang, v.code, true, 'sql');
      e.el.style.display = 'none'; e.el.classList.add('variant'); others[v.lang] = e; frag.appendChild(e.el);
    });
    const actions = document.createElement('div'); actions.className = 'actions';
    actions.innerHTML = '<button class="btn prim btn-run"' + (ready ? '' : ' disabled') + '>' + esc(L.run) + '</button>' +
      (opts.challenge ? '<button class="btn ok btn-run btn-check"' + (ready ? '' : ' disabled') + '>' + esc(L.check) + '</button>' : '<button class="btn btn-run btn-plan"' + (ready ? '' : ' disabled') + '>' + esc(L.plan) + '</button>') +
      '<button class="btn btn-reset">' + esc(L.restore) + '</button>' + (opts.challenge ? '<button class="btn btn-sol">' + esc(L.showSolution) + '</button>' : '') +
      '<span class="shortcut">' + (opts.challenge ? L.challengeShortcut : L.shortcut) + '</span>';
    frag.appendChild(actions);
    const output = document.createElement('div'); output.className = 'output-sql'; frag.appendChild(output);
    const result = document.createElement('div'); result.className = 'result'; result.setAttribute('role', 'status'); frag.appendChild(result);
    let solDiv = null;
    if (opts.challenge) {
      solDiv = document.createElement('div'); solDiv.className = 'solution';
      solDiv.innerHTML = '<div class="solution-label">' + esc(L.solution) + '</div><div class="static-code editor"><pre>' + highlight(opts.solution, 'sql') + '</pre></div><div class="actions"><button class="btn btn-use">' + esc(L.copy) + '</button></div>';
      frag.appendChild(solDiv);
      solDiv.querySelector('.btn-use').onclick = () => ed.setValue(opts.solution);
    }
    if (tabs) tabs.addEventListener('click', e => {
      const b = e.target.closest('.tab'); if (!b) return;
      tabs.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === b));
      ed.el.style.display = b.dataset.l === 'sql' ? '' : 'none';
      Object.entries(others).forEach(([l, e2]) => e2.el.style.display = l === b.dataset.l ? '' : 'none');
      actions.style.display = b.dataset.l === 'sql' ? '' : 'none';
    });

    async function run(mode) {
      if (!ready) return;
      const buttons = actions.querySelectorAll('.btn-run'); buttons.forEach(b => b.disabled = true);
      output.innerHTML = '<div class="res-head">' + esc(L.running) + '</div>'; output.classList.add('vis'); result.className = 'result'; ed.markError(0);
      const t0 = performance.now();
      let res;
      try {
        res = await api('api/run', { sql: ed.value(), explain: mode === 'plan',
          expected: mode === 'check' ? opts.solution : undefined, ordered: !!opts.ordered });
      } catch (e) { res = { ok: false, results: [], error: { message: L.noServer } }; }
      buttons.forEach(b => b.disabled = false);
      const ms = Math.round(performance.now() - t0);
      let html = (res.results || []).map(r => resultTable(r, esc(L.statement(r.statement + 1)))).join('');
      if (res.error) {
        html += '<div class="tb">' + (res.error.line ? '<a data-l="' + res.error.line + '">' + esc(L.line(res.error.line)) + '</a> · ' : '') + esc(translateError(res.error.message)) + '</div>';
        if (res.error.line) ed.markError(res.error.line);
      }
      output.innerHTML = (html || '<div class="res-head">' + esc(L.nothing) + '</div>') + '<div class="res-footer">' + esc(L.footer(ms)) + '</div>';
      output.querySelectorAll('a[data-l]').forEach(a => a.onclick = () => ed.goToLine(+a.dataset.l));
      if (mode === 'check') {
        const v = res.check;
        if (v && v.ok) { result.className = 'result vis ok'; result.textContent = L.success; markDone(opts.id); }
        else { result.className = 'result vis fail'; result.textContent = L.notYet(v ? translateReason(v.reason) : L.withError); }
      } else if (!opts.challenge && res.ok) markDone(opts.id);
    }
    actions.querySelector('.btn-run').onclick = () => run('normal');
    if (opts.challenge) actions.querySelector('.btn-check').onclick = () => run('check');
    else actions.querySelector('.btn-plan').onclick = () => run('plan');
    actions.querySelector('.btn-reset').onclick = () => { ed.setValue(opts.code); output.classList.remove('vis'); result.className = 'result'; };
    if (solDiv) actions.querySelector('.btn-sol').onclick = () => { if (solDiv.classList.contains('vis') || confirm(L.confirmSolution)) solDiv.classList.toggle('vis'); };
    ed.ta.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(opts.challenge && e.shiftKey ? 'check' : 'normal'); } });
    return frag;
  }

  // ---------- rendering ----------
  function staticBlock(code, lang) { const d = document.createElement('div'); d.className = 'static-code editor'; d.innerHTML = '<pre>' + highlight(code, lang) + '</pre>'; return d; }
  function renderChapter(ci) {
    const chapter = BOOK.chapters[ci];
    content.innerHTML = '<div class="kicker">' + esc(L.chapter(ci + 1, BOOK.chapters.length)) + '</div><h2 class="chapter">' + esc(chapter.title) + '</h2>';
    let list = null;
    chapter.blocks.forEach(b => {
      if (b.t !== 'bullet') list = null;
      let el = null;
      switch (b.t) {
        case 'h2': el = document.createElement('h3'); el.className = 'sec'; el.id = b.anchor; el.innerHTML = inline(b.text); break;
        case 'h3': el = document.createElement('h4'); el.innerHTML = inline(b.text); break;
        case 'p': el = document.createElement('p'); el.innerHTML = inline(b.text); break;
        case 'bullet':
          if (!list) { list = document.createElement('ul'); list.className = 'list'; content.appendChild(list); }
          const li = document.createElement('li'); li.innerHTML = inline(b.text); list.appendChild(li); return;
        case 'note':
          el = document.createElement('div'); el.className = 'note ' + b.kind;
          el.innerHTML = '<div class="note-title">' + esc(L.notes[b.kind] || UI.pt.notes[b.kind] || b.kind) + '</div><div class="tx">' + inline(b.text) + '</div>';
          break;
        case 'table':
          el = document.createElement('div'); el.className = 'table';
          el.innerHTML = '<table>' + b.rows.map((r, i) => '<tr>' + r.map(c => (i ? '<td>' : '<th>') + inline(c) + (i ? '</td>' : '</th>')).join('') + '</tr>').join('') + '</table>';
          break;
        case 'code': el = document.createElement('div'); el.style.margin = '0 0 18px'; el.appendChild(b.lang === 'sql' ? cell({ id: 'c-' + ci + '-' + b.code.length, code: b.code }) : staticBlock(b.code, b.lang)); break;
        case 'ex': {
          el = document.createElement('div'); el.className = 'ex';
          el.innerHTML = '<div class="kicker">' + esc(L.example) + '</div><div class="title">' + inline(b.title) + '</div><div class="meta"><span class="file">' + esc(b.file) + '</span></div>';
          if (b.lang === 'sql') el.appendChild(cell({ id: b.id, code: b.code, variants: b.variants }));
          else {
            const blocks = [{ lang: b.lang, code: b.code }, ...(b.variants || [])];
            blocks.forEach(v => {
              if (blocks.length > 1) { const r = document.createElement('div'); r.className = 'file block-label'; r.textContent = DIALECT_NAMES[v.lang] || v.lang; el.appendChild(r); }
              el.appendChild(staticBlock(v.code, v.lang));
            });
          }
          if (b.callouts.length) {
            const ul = document.createElement('ul'); ul.className = 'callouts';
            ul.innerHTML = b.callouts.map((c, i) => '<li><span class="n">' + CIRC[i] + '</span><span>' + inline(c) + '</span></li>').join('');
            el.appendChild(ul);
          }
          break;
        }
        case 'challenge': {
          const practice = b.practice || !b.solution;
          el = document.createElement('div'); el.className = 'ex challenge';
          el.innerHTML = '<div class="kicker">' + esc(practice ? L.practice : L.challenge) + '</div><div class="title">' + inline(b.title) + '</div><div class="prompt">' + inline(b.prompt) + (b.ordered ? ' <i>' + esc(L.orderChecked) + '</i>' : '') + '</div>';
          if (practice) {
            // chapter 8 (the English case study, "Step N") keeps its own English hint in every language
            const badge = /^Step /.test(b.title) ? UI.en.practiceBadge : L.practiceBadge;
            el.querySelector('.title').insertAdjacentHTML('afterend', '<div class="practice-badge">' + esc(badge) + '</div>');
            el.appendChild(cell({ id: b.id, code: b.starter }));
          } else el.appendChild(cell({ id: b.id, code: b.starter, solution: b.solution, ordered: b.ordered, challenge: true }));
          break;
        }
      }
      if (el) content.appendChild(el);
    });
    const pager = document.createElement('div'); pager.className = 'pagination';
    pager.innerHTML = (ci > 0 ? '<a href="#chapter-' + ci + '">← ' + esc(BOOK.chapters[ci - 1].title) + '</a>' : '<a href="#home">← ' + esc(L.home) + '</a>') +
      (ci < BOOK.chapters.length - 1 ? '<a href="#chapter-' + (ci + 2) + '">' + esc(BOOK.chapters[ci + 1].title) + ' →</a>' : '<a href="#console">' + esc(L.console) + ' →</a>');
    content.appendChild(pager);
    $('mobileTitle').textContent = chapter.title;
  }
  function renderHome() {
    content.innerHTML = '<div class="home"><h2>' + esc(L.title) + '</h2><div class="sub">' + esc(BOOK.subtitle) + '</div>' +
      '<div class="prompt">$ ' + L.prompt + '</div>' +
      '<div class="label"><span>' + esc(L.howToUse) + '</span></div>' +
      '<div class="how"><ul>' + L.how.map(li => '<li>' + li + '</li>').join('') + '</ul></div>' +
      '<div class="label"><span>' + esc(L.cardsLabel) + '</span></div><div class="cards">' +
      BOOK.chapters.map((c, i) => {
        const f = c.activities.filter(id => state.done[id]).length, t = c.activities.length;
        return '<a class="card" href="#chapter-' + (i + 1) + '"><span class="chapter-num">cap-' + (i + 1) + '</span><b>' + esc(c.title) + '</b><small>' + f + '/' + esc(L.activities(t)) + '</small>' +
          '<span class="mini"><span style="width:' + (t ? 100 * f / t : 0) + '%"></span></span></a>';
      }).join('') +
      '<a class="card" href="#console"><span class="chapter-num">console</span><b>' + esc(L.console) + '</b><small>' + esc(L.consoleSub) + '</small></a></div></div>';
    $('mobileTitle').textContent = L.title;
  }
  function renderConsole() {
    content.innerHTML = '<div class="kicker">console</div><h2 class="chapter">' + esc(L.console) + '</h2><p>' + L.consoleText + '</p>';
    const d = document.createElement('div'); d.className = 'ex';
    d.appendChild(cell({ id: 'console', code: "SELECT status, count(*) AS pedidos\nFROM pedidos\nGROUP BY status\nORDER BY pedidos DESC;\n" }));
    content.appendChild(d);
    $('mobileTitle').textContent = L.console;
  }

  const nav = $('nav');
  nav.innerHTML = '<a href="#home" class="chapter">' + esc(L.home) + '</a>' + BOOK.chapters.map((c, i) =>
    '<a class="chapter" data-chapter="' + i + '" href="#chapter-' + (i + 1) + '"><span>' + esc(c.title) + '</span><span class="cnt"></span></a>' +
    c.sections.map(s => '<a class="sec" href="#chapter-' + (i + 1) + '" data-anchor="' + s.anchor + '">' + inline(s.title) + '</a>').join('')).join('') +
    '<a class="chapter" href="#console">' + esc(L.console) + '</a>';
  BOOK.chapters.forEach(c => activities.push(...c.activities));
  let anchor = null;
  nav.addEventListener('click', e => { const a = e.target.closest('a'); if (!a) return; anchor = a.dataset.anchor || null; $('menu').classList.remove('open'); if (a.getAttribute('href') === location.hash) { e.preventDefault(); route(); } });
  function route() {
    // links saved before the English rename used #inicio and #cap-N
    const h = location.hash.slice(1).replace(/^inicio$/, 'home').replace(/^cap-(?=\d+$)/, 'chapter-') || 'home';
    const m = h.match(/^chapter-(\d+)$/);
    nav.querySelectorAll('a.chapter').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + h));
    if (m && BOOK.chapters[+m[1] - 1]) renderChapter(+m[1] - 1); else if (h === 'console') renderConsole(); else renderHome();
    const anchorTarget = anchor && document.getElementById(anchor); if (anchorTarget) anchorTarget.scrollIntoView(); else $('main').scrollTop = 0; anchor = null;
  }
  window.addEventListener('hashchange', route);
  route(); updateProgress(); init();
  }
})();
</script>
</body>
</html>
