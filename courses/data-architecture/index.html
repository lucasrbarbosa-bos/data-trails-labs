<title>Data Architecture</title>
<!--
  Data Architecture trail (engine "none": reading only, nothing runs on the server).
  Content lives in content/<lang>/ (en, es, pt): manifest.json lists parts and chapters, and each
  chapter is NN-<id>.json, a list of blocks rendered below (see RENDER in the script).
  Theme, fonts and the top bar (theme picker, EN | ES | PT) come from the hub: /hub/theme.css and

  Page contract (docs/ADDING_A_COURSE.md): relative URLs, TRAIL.progress(done, total), and
  localStorage keys prefixed with the trail id.
-->
<!-- course styles -->
<link rel="stylesheet" href="course.css">

    <div class="progress"><div class="course-progress-bar"><div id="bar"></div></div><small id="ptext"></small></div>

  </aside>
  <main class="course-main" id="course-main">
